<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Encaixe das Letrinhas</title>
    <!-- Tailwind CSS para Estilização Responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        /* Fonte lúdica e arredondada */
        body {
            font-family: 'Fredoka One', cursive, sans-serif;
            background-color: #e0f7fa; /* Tom pastel suave verde-água/azul */
            touch-action: manipulation; /* Evita zoom acidental no mobile ao tocar rápido */
        }

        /* Animação do Emoji Pular (Vitória) */
        @keyframes jump {
            0%, 100% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-40px) scale(1.1) rotate(-5deg); }
            50% { transform: translateY(0) scale(1.05) rotate(5deg); }
            70% { transform: translateY(-20px) scale(1.1) rotate(-3deg); }
        }
        .anim-jump {
            animation: jump 1s ease-in-out infinite;
        }

        /* Animação de Tremor (Erro) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px) rotate(-5deg); }
            40%, 80% { transform: translateX(10px) rotate(5deg); }
        }
        .anim-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Estilo da Letra Selecionada */
        .selected-letter {
            transform: scale(1.15) translateY(-10px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
            border: 4px solid #fff;
            filter: brightness(1.1);
        }

        /* Botões Base */
        .letter-btn, .slot {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Efeito visual nos botões para dar aspecto de profundidade */
        .btn-depth {
            box-shadow: 0 6px 0px rgba(0,0,0,0.2);
        }
        .btn-depth:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.2);
        }

        /* Animação de pulso no botão 'Próxima Palavra' */
        @keyframes pulse-btn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .anim-pulse {
            animation: pulse-btn 2s infinite;
        }
    </style>
</head>
<body class="overflow-hidden flex flex-col items-center justify-between h-screen w-screen relative">

    <!-- Canvas para Efeitos de Estrelas na Vitória -->
    <canvas id="victory-canvas" class="absolute inset-0 pointer-events-none z-50"></canvas>

    <!-- Container Principal do Jogo -->
    <main class="relative z-10 flex flex-col items-center justify-center w-full h-full max-w-4xl p-4 sm:p-8">
        
        <!-- Cabeçalho / Ilustração -->
        <div class="flex-1 flex items-center justify-center min-h-[150px] sm:min-h-[200px]">
            <div id="emoji-display" class="text-8xl sm:text-[150px] drop-shadow-2xl transition-transform duration-300">
                <!-- Emoji injetado via JS -->
            </div>
        </div>

        <!-- Área Central / Silhuetas (Alvos) -->
        <div class="flex-1 flex flex-col justify-center items-center w-full mb-6">
            <div id="slots-container" class="flex flex-wrap justify-center gap-2 sm:gap-4 w-full">
                <!-- Silhuetas injetadas via JS -->
            </div>
        </div>

        <!-- Área Inferior / Letras (Peças) -->
        <div class="flex-1 flex flex-col justify-center items-center w-full min-h-[120px]">
            <div id="letters-container" class="flex flex-wrap justify-center gap-3 sm:gap-5 w-full">
                <!-- Letras injetadas via JS -->
            </div>

            <!-- Botão Próxima Palavra (Oculto inicialmente) -->
            <button id="next-btn" class="hidden mt-6 px-8 py-4 bg-green-500 text-white text-2xl sm:text-3xl rounded-3xl border-b-8 border-green-700 active:border-b-0 active:translate-y-2 shadow-xl anim-pulse flex items-center gap-2">
                Continuar <span class="text-4xl">▶</span>
            </button>
        </div>

    </main>

    <script>
        /**
         * Lógica do Jogo Encaixe das Letrinhas
         */

        // 1. DADOS DO JOGO - Progressão e Palavras
        const wordsList = [
            // Fase 1: 3 letras
            { word: "BOI", emoji: "🐂" },
            { word: "CÃO", emoji: "🐕" },
            { word: "UVA", emoji: "🍇" },
            // Fase 2: 4 letras
            { word: "GATO", emoji: "🐈" },
            { word: "SAPO", emoji: "🐸" },
            { word: "BOLA", emoji: "⚽" },
            // Fase 3: 5 a 6 letras
            { word: "PORCO", emoji: "🐖" },
            { word: "PEIXE", emoji: "🐟" },
            { word: "CAVALO", emoji: "🐎" },
            // Fase 4: Desafio Final
            { word: "FORMIGA", emoji: "🐜" },
            { word: "CACHORRO", emoji: "🐶" }
        ];

        // 2. ESTADO DO JOGO
        let currentWordIndex = 0;
        let currentWord = "";
        let selectedLetterBtn = null;
        let correctlyPlacedCount = 0;
        let audioCtx = null; // Para os sons gerados via Web Audio API

        // 3. REFERÊNCIAS DO DOM
        const emojiDisplay = document.getElementById('emoji-display');
        const slotsContainer = document.getElementById('slots-container');
        const lettersContainer = document.getElementById('letters-container');
        const nextBtn = document.getElementById('next-btn');

        // 4. INICIALIZAÇÃO
        function initGame() {
            loadWord(currentWordIndex);
            
            // Evento de próxima palavra
            nextBtn.addEventListener('click', () => {
                currentWordIndex++;
                if (currentWordIndex >= wordsList.length) {
                    currentWordIndex = 0; // Reinicia o jogo ao terminar
                }
                loadWord(currentWordIndex);
            });

            // Inicializa áudio no primeiro toque na tela para evitar bloqueio do navegador
            document.body.addEventListener('pointerdown', initAudio, { once: true });
        }

        function loadWord(index) {
            // Limpa o estado
            selectedLetterBtn = null;
            correctlyPlacedCount = 0;
            emojiDisplay.classList.remove('anim-jump');
            slotsContainer.innerHTML = '';
            lettersContainer.innerHTML = '';
            nextBtn.classList.add('hidden');
            lettersContainer.classList.remove('hidden');
            stopParticles();

            const levelData = wordsList[index];
            currentWord = levelData.word;
            emojiDisplay.textContent = levelData.emoji;

            const charsArray = Array.from(currentWord);
            
            // Criar Silhuetas
            charsArray.forEach((char, i) => {
                const slot = document.createElement('div');
                // Estilo da silhueta vazada: Fundo translúcido, borda tracejada
                slot.className = `slot w-16 h-20 sm:w-20 sm:h-24 flex items-center justify-center text-4xl sm:text-5xl rounded-2xl
                                  border-4 border-dashed border-gray-400 bg-gray-200/50 text-gray-400 cursor-pointer`;
                slot.textContent = char; // A letra fica visível como dica suave
                slot.dataset.char = char;
                slot.dataset.filled = "false";
                
                // Evento de toque na silhueta
                slot.addEventListener('click', () => handleSlotClick(slot));
                slotsContainer.appendChild(slot);
            });

            // Criar Letras Embaralhadas
            // Embaralhar
            const shuffledChars = [...charsArray].sort(() => Math.random() - 0.5);

            shuffledChars.forEach((char, i) => {
                const btn = document.createElement('div');
                
                // Determina se é vogal ou consoante para aplicar cores
                const isVowel = /^[AEIOUÁÉÍÓÚÂÊÔÃÕ]$/i.test(char);
                
                // Vogais: Vermelhas/Amarelas (Aqui usaremos Amarelo vibrante com texto laranja/vermelho)
                // Consoantes: Azuis/Verdes (Aqui usaremos Azul vibrante)
                let colorClasses = isVowel 
                    ? 'bg-yellow-300 border-yellow-500 text-orange-600' 
                    : 'bg-blue-400 border-blue-600 text-white';

                btn.className = `letter-btn btn-depth w-16 h-16 sm:w-20 sm:h-20 flex items-center justify-center text-4xl sm:text-5xl rounded-2xl cursor-pointer border-b-8 ${colorClasses}`;
                btn.textContent = char;
                btn.dataset.char = char;
                btn.dataset.colorClass = colorClasses; // Guardamos para pintar o slot depois
                
                // Evento de toque na letra
                btn.addEventListener('click', () => handleLetterSelect(btn));
                lettersContainer.appendChild(btn);
            });
        }

        // 5. INTERAÇÕES
        function handleLetterSelect(btn) {
            // Se o botão já foi usado/escondido, ignora
            if (btn.style.visibility === 'hidden') return;

            // Reproduz um pequeno clique (Opcional, apenas para feedback)
            playSound('tick');

            // Remove a seleção anterior
            if (selectedLetterBtn) {
                selectedLetterBtn.classList.remove('selected-letter');
            }

            // Seleciona a nova
            selectedLetterBtn = btn;
            selectedLetterBtn.classList.add('selected-letter');
        }

        function handleSlotClick(slot) {
            // Se nenhuma letra foi selecionada ou se o slot já está preenchido
            if (!selectedLetterBtn || slot.dataset.filled === "true") {
                if(!selectedLetterBtn && slot.dataset.filled === "false") {
                     // Feedback visual de que precisa selecionar uma letra primeiro
                     lettersContainer.classList.add('anim-shake');
                     setTimeout(() => lettersContainer.classList.remove('anim-shake'), 400);
                }
                return;
            }

            // Verifica se a letra selecionada é a correta para este slot
            if (selectedLetterBtn.dataset.char === slot.dataset.char) {
                // ACERTO!
                playSound('success');
                
                // Preenche o slot
                slot.dataset.filled = "true";
                // Remove estilos de silhueta
                slot.classList.remove('border-dashed', 'border-gray-400', 'bg-gray-200/50', 'text-gray-400');
                
                // Adiciona os estilos coloridos da letra
                const colorClasses = selectedLetterBtn.dataset.colorClass.split(' ');
                // Ajusta a borda do slot preenchido
                slot.classList.add('border-solid', 'border-4', ...colorClasses);
                // Remove a borda grossa (border-b-8) que era da peça solta, usando border-4
                slot.classList.remove('border-b-8'); 
                slot.textContent = slot.dataset.char; // Garante opacidade 100%

                // Esconde a letra do pool (Bandeja)
                selectedLetterBtn.style.visibility = 'hidden';
                selectedLetterBtn.classList.remove('selected-letter');
                selectedLetterBtn = null;

                correctlyPlacedCount++;

                // Verifica Vitória
                if (correctlyPlacedCount === currentWord.length) {
                    triggerWin();
                }
            } else {
                // ERRO!
                playSound('error');
                slot.classList.add('anim-shake');
                setTimeout(() => slot.classList.remove('anim-shake'), 400);
            }
        }

        function triggerWin() {
            playSound('win');
            speakWord(currentWord);
            
            // Anima o Emoji
            emojiDisplay.classList.add('anim-jump');
            
            // Esconde bandeja vazia e mostra botão
            lettersContainer.classList.add('hidden');
            nextBtn.classList.remove('hidden');

            // Inicia partículas (Estrelinhas)
            startParticles();
        }

        // 6. SISTEMA DE ÁUDIO SINTÉTICO (Sem dependências externas)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            // Se o contexto foi suspenso (políticas do navegador), retoma
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;

            switch(type) {
                case 'tick':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'success':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'error':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(150, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                case 'win':
                    // Arpejo feliz (Acorde maior)
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // Dó, Mi, Sol, Dó
                    notes.forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'square';
                        o.frequency.value = freq;
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        
                        g.gain.setValueAtTime(0.15, now + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                        
                        o.start(now + i * 0.1);
                        o.stop(now + i * 0.1 + 0.3);
                    });
                    break;
            }
        }

        // Função de Text-to-Speech (Sintetizador de Voz Nativo)
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                // Cancela qualquer fala que esteja na fila para evitar sobreposição
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'pt-BR'; // Português do Brasil
                utterance.rate = 0.85;    // Velocidade um pouco mais lenta (ideal para crianças)
                utterance.pitch = 1.2;    // Tom de voz levemente mais agudo/alegre
                
                // Aguarda 400ms para a musiquinha de vitória tocar primeiro
                setTimeout(() => {
                    window.speechSynthesis.speak(utterance);
                }, 400); 
            }
        }

        // 7. SISTEMA DE PARTÍCULAS (ESTRELAS EM CANVAS)
        const canvas = document.getElementById('victory-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class StarParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                // Velocidade explosiva
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 15 + 5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.4;
                this.size = Math.random() * 15 + 10;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 15;
                this.life = 1.0; // Opacidade
                this.decay = Math.random() * 0.015 + 0.01;
                
                // Cores lúdicas (Amarelo, Laranja, Rosa, Ciano)
                const colors = ['#FDE047', '#F97316', '#EC4899', '#06B6D4'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            
            update() {
                this.x += this.vx;
                this.vy += this.gravity;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
                this.life -= this.decay;
            }
            
            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                
                // Desenhar Estrela de 5 pontas
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * this.size,
                               -Math.sin((18 + i * 72) * Math.PI / 180) * this.size);
                    ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (this.size / 2.5),
                               -Math.sin((54 + i * 72) * Math.PI / 180) * (this.size / 2.5));
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        function startParticles() {
            particles = [];
            // Explosão no centro da tela
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            for (let i = 0; i < 60; i++) {
                particles.push(new StarParticle(cx, cy));
            }
            if (!animationFrameId) {
                animateParticles();
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let alive = false;
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].life > 0) alive = true;
            }
            
            if (alive) {
                animationFrameId = requestAnimationFrame(animateParticles);
            } else {
                stopParticles();
            }
        }

        function stopParticles() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = [];
        }

        // 8. START
        window.onload = initGame;

    </script>
</body>
</html>
