<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Encaixe das Letrinhas</title>
    <!-- Tailwind CSS para Estilização Responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        /* Fonte lúdica e arredondada */
        body {
            font-family: 'Fredoka One', cursive, sans-serif;
            background: linear-gradient(180deg, #e0f7fa 0%, #fff3e0 100%);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Animação do Emoji Pular (Vitória) */
        @keyframes jump {
            0%, 100% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-30px) scale(1.15) rotate(-5deg); }
            50% { transform: translateY(0) scale(1.05) rotate(5deg); }
            70% { transform: translateY(-15px) scale(1.1) rotate(-3deg); }
        }
        .anim-jump {
            animation: jump 1s ease-in-out infinite;
        }

        /* Animação de Tremor (Erro) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px) rotate(-5deg); }
            40%, 80% { transform: translateX(10px) rotate(5deg); }
        }
        .anim-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Estilo da Letra Selecionada */
        .selected-letter {
            transform: scale(1.18) translateY(-10px) !important;
            box-shadow: 0 16px 25px rgba(0,0,0,0.25) !important;
            border-color: #ffffff !important;
            filter: brightness(1.1);
        }

        /* Botões Base */
        .letter-btn, .slot {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-tap-highlight-color: transparent;
        }

        /* Efeito de profundidade 3D nos botões */
        .btn-depth {
            box-shadow: 0 6px 0px rgba(0,0,0,0.2);
        }
        .btn-depth:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.2);
        }

        /* Animação de pulso no botão 'Próxima Palavra' */
        @keyframes pulse-btn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .anim-pulse {
            animation: pulse-btn 1.5s infinite;
        }
    </style>
</head>
<body class="overflow-hidden flex flex-col items-center justify-between min-h-screen w-screen relative">

    <!-- Canvas para Efeitos de Estrelas na Vitória -->
    <canvas id="victory-canvas" class="absolute inset-0 pointer-events-none z-50"></canvas>

    <!-- Barra de navegação superior (Voltar ao Menu + Falar palavra) -->
    <header class="w-full max-w-4xl px-4 pt-3 flex justify-between items-center z-20">
        <a href="index.html" class="px-4 py-2 bg-white/90 hover:bg-white text-gray-700 text-lg rounded-2xl shadow-md border-2 border-gray-200 flex items-center gap-1 active:scale-95">
            🏠 <span>Menu</span>
        </a>
        <div class="flex flex-col items-center">
            <span id="level-badge" class="text-xs bg-amber-400 text-amber-950 px-2.5 py-0.5 rounded-full font-bold shadow-sm">
                Fase: 3 Letras
            </span>
            <span class="text-sm sm:text-base font-bold text-indigo-700" id="progress-info">
                Palavra 1 de 31
            </span>
        </div>
        <button id="speaker-btn" title="Ouvir palavra" class="px-3 py-2 bg-yellow-400 hover:bg-yellow-300 text-yellow-950 text-xl rounded-2xl shadow-md flex items-center gap-1 active:scale-95">
            🔊
        </button>
    </header>

    <!-- Container Principal do Jogo -->
    <main class="relative z-10 flex flex-col items-center justify-between w-full flex-1 max-w-4xl p-3 sm:p-6">
        
        <!-- Ilustração / Emoji interativo -->
        <div class="flex flex-col items-center justify-center my-auto cursor-pointer" id="emoji-wrapper" title="Tocar para ouvir a palavra">
            <div id="emoji-display" class="text-8xl sm:text-[140px] drop-shadow-2xl transition-transform duration-300 hover:scale-105 active:scale-95">
                <!-- Emoji injetado via JS -->
            </div>
            <span class="text-sm sm:text-base text-gray-500 font-sans mt-1">Toque para ouvir 🔊</span>
        </div>

        <!-- Área Central / Silhuetas (Alvos das Letras) -->
        <div class="flex flex-col justify-center items-center w-full my-auto">
            <div id="slots-container" class="flex flex-wrap justify-center gap-2 sm:gap-3.5 w-full">
                <!-- Silhuetas injetadas via JS -->
            </div>
        </div>

        <!-- Área Inferior / Letras Embaralhadas (Bandeja) -->
        <div class="flex flex-col justify-center items-center w-full min-h-[120px] mb-2 sm:mb-4">
            <div id="letters-container" class="flex flex-wrap justify-center gap-2.5 sm:gap-4 w-full">
                <!-- Letras injetadas via JS -->
            </div>

            <!-- Botão Próxima Palavra -->
            <button id="next-btn" class="hidden px-8 py-3.5 bg-green-500 hover:bg-green-600 text-white text-2xl sm:text-3xl rounded-3xl border-b-8 border-green-700 active:border-b-0 active:translate-y-2 shadow-2xl anim-pulse flex items-center gap-3">
                <span>Muito Bem! Próxima</span> <span class="text-3xl sm:text-4xl">▶</span>
            </button>
        </div>

    </main>

    <script>
        /**
         * Lógica do Jogo Encaixe das Letrinhas Educativo com Progressão Gradual
         */

        // 1. BANCO DE PALAVRAS ORGANIZADO POR TAMANHO (3, 4, 5, 6, 7+ letras)
        const wordsByLength = {
            3: [
                { word: "BOI", emoji: "🐂" },
                { word: "CÃO", emoji: "🐕" },
                { word: "UVA", emoji: "🍇" },
                { word: "SOL", emoji: "☀️" },
                { word: "LUA", emoji: "🌙" }
            ],
            4: [
                { word: "GATO", emoji: "🐈" },
                { word: "SAPO", emoji: "🐸" },
                { word: "BOLA", emoji: "⚽" },
                { word: "PATO", emoji: "🦆" },
                { word: "LEÃO", emoji: "🦁" },
                { word: "MAÇÃ", emoji: "🍎" },
                { word: "BOLO", emoji: "🎂" },
                { word: "PIPA", emoji: "🪁" },
                { word: "CASA", emoji: "🏠" },
                { word: "TREM", emoji: "🚂" },
                { word: "FLOR", emoji: "🌸" }
            ],
            5: [
                { word: "PORCO", emoji: "🐖" },
                { word: "PEIXE", emoji: "🐟" },
                { word: "CARRO", emoji: "🚗" }
            ],
            6: [
                { word: "CAVALO", emoji: "🐎" },
                { word: "MACACO", emoji: "🐒" },
                { word: "BANANA", emoji: "🍌" },
                { word: "PIPOCA", emoji: "🍿" }
            ],
            7: [ // 7 letras ou mais (Desafio avançado)
                { word: "FORMIGA", emoji: "🐜" },
                { word: "CACHORRO", emoji: "🐶" },
                { word: "GIRAFA", emoji: "🦒" },
                { word: "ELEFANTE", emoji: "🐘" },
                { word: "BORBOLETA", emoji: "🦋" },
                { word: "CORAÇÃO", emoji: "❤️" },
                { word: "TARTARUGA", emoji: "🐢" },
                { word: "MELANCIA", emoji: "🍉" }
            ]
        };

        // Algoritmo de Fisher-Yates para embaralhamento
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Constrói a lista progressiva:
        // Primeiro todas de 3 letras (sorteadas entre si), depois 4, depois 5, 6, 7+
        function buildGradualWordsList() {
            const lengths = [3, 4, 5, 6, 7];
            let fullList = [];
            lengths.forEach(len => {
                if (wordsByLength[len]) {
                    fullList = fullList.concat(shuffleArray(wordsByLength[len]));
                }
            });
            return fullList;
        }

        let wordsList = buildGradualWordsList();
        let currentWordIndex = 0;
        let currentWord = "";
        let selectedLetterBtn = null;
        let correctlyPlacedCount = 0;
        let audioCtx = null;

        // 2. ELEMENTOS DO DOM
        const emojiDisplay = document.getElementById('emoji-display');
        const emojiWrapper = document.getElementById('emoji-wrapper');
        const slotsContainer = document.getElementById('slots-container');
        const lettersContainer = document.getElementById('letters-container');
        const nextBtn = document.getElementById('next-btn');
        const progressInfo = document.getElementById('progress-info');
        const levelBadge = document.getElementById('level-badge');
        const speakerBtn = document.getElementById('speaker-btn');

        // Pronúncias didáticas amigáveis em português
        const phoneticLetters = {
            'A': 'A', 'Á': 'A', 'Ã': 'Ã', 'Â': 'A',
            'B': 'Bê', 'C': 'Cê', 'Ç': 'Cê-cedilha', 'D': 'Dê',
            'E': 'É', 'É': 'É', 'Ê': 'Ê', 'F': 'Efe',
            'G': 'Gê', 'H': 'Agá', 'I': 'I', 'Í': 'I',
            'J': 'Jota', 'K': 'Cá', 'L': 'Ele', 'M': 'Eme',
            'N': 'Ene', 'O': 'Ó', 'Ó': 'Ó', 'Ô': 'Ô', 'Õ': 'Õ',
            'P': 'Pê', 'Q': 'Quê', 'R': 'Erre', 'S': 'Esse',
            'T': 'Tê', 'U': 'U', 'Ú': 'U', 'V': 'Vê',
            'W': 'Dáblio', 'X': 'Xis', 'Y': 'Ípsilon', 'Z': 'Zê'
        };

        // 3. INICIALIZAÇÃO
        function initGame() {
            loadWord(currentWordIndex);

            nextBtn.addEventListener('click', () => {
                currentWordIndex++;
                if (currentWordIndex >= wordsList.length) {
                    // Ao terminar todas, reconstrói com nova ordem aleatória por nível
                    wordsList = buildGradualWordsList();
                    currentWordIndex = 0;
                }
                loadWord(currentWordIndex);
            });

            speakerBtn.addEventListener('click', () => {
                speakText(currentWord);
            });

            emojiWrapper.addEventListener('click', () => {
                speakText(currentWord);
            });

            document.body.addEventListener('pointerdown', initAudio, { once: true });
        }

        function loadWord(index) {
            selectedLetterBtn = null;
            correctlyPlacedCount = 0;
            emojiDisplay.classList.remove('anim-jump');
            slotsContainer.innerHTML = '';
            lettersContainer.innerHTML = '';
            nextBtn.classList.add('hidden');
            lettersContainer.classList.remove('hidden');
            stopParticles();

            const levelData = wordsList[index];
            currentWord = levelData.word;
            emojiDisplay.textContent = levelData.emoji;

            const letterCount = currentWord.length;
            levelBadge.textContent = `Fase: ${letterCount} Letras`;
            progressInfo.textContent = `Palavra ${index + 1} de ${wordsList.length}`;

            const charsArray = Array.from(currentWord);

            // Criar Silhuetas
            charsArray.forEach((char) => {
                const slot = document.createElement('div');
                const isSmall = charsArray.length > 6;
                const sizeClass = isSmall 
                    ? 'w-11 h-16 sm:w-16 sm:h-20 text-3xl sm:text-4xl' 
                    : 'w-14 h-18 sm:w-20 sm:h-24 text-4xl sm:text-5xl';

                slot.className = `slot ${sizeClass} flex items-center justify-center rounded-2xl
                                  border-4 border-dashed border-gray-400 bg-gray-200/50 text-gray-400 cursor-pointer shadow-inner`;
                slot.textContent = char;
                slot.dataset.char = char;
                slot.dataset.filled = "false";

                slot.addEventListener('click', () => handleSlotClick(slot));
                slotsContainer.appendChild(slot);
            });

            // Criar Letras Embaralhadas na Bandeja
            const shuffledChars = shuffleArray(charsArray);

            shuffledChars.forEach((char) => {
                const btn = document.createElement('div');
                const isVowel = /^[AEIOUÁÉÍÓÚÂÊÔÃÕ]$/i.test(char);

                let colorClasses = isVowel 
                    ? 'bg-amber-300 border-amber-500 text-amber-900' 
                    : 'bg-sky-400 border-sky-600 text-white';

                const isSmall = charsArray.length > 6;
                const sizeClass = isSmall 
                    ? 'w-11 h-14 sm:w-16 sm:h-18 text-3xl sm:text-4xl' 
                    : 'w-14 h-16 sm:w-20 sm:h-20 text-4xl sm:text-5xl';

                btn.className = `letter-btn btn-depth ${sizeClass} flex items-center justify-center rounded-2xl cursor-pointer border-b-8 ${colorClasses} font-black`;
                btn.textContent = char;
                btn.dataset.char = char;
                btn.dataset.colorClass = colorClasses;

                btn.addEventListener('click', () => handleLetterSelect(btn));
                lettersContainer.appendChild(btn);
            });

            // Pronuncia a palavra ao iniciar a fase
            setTimeout(() => {
                speakText(currentWord);
            }, 300);
        }

        // 4. INTERAÇÕES E PRONÚNCIA
        function handleLetterSelect(btn) {
            if (btn.style.visibility === 'hidden') return;

            playSound('tick');
            speakLetter(btn.dataset.char); // Pronuncia a letra clicada imediatamente

            if (selectedLetterBtn) {
                selectedLetterBtn.classList.remove('selected-letter');
            }

            selectedLetterBtn = btn;
            selectedLetterBtn.classList.add('selected-letter');
        }

        function handleSlotClick(slot) {
            if (!selectedLetterBtn) {
                if (slot.dataset.filled === "false") {
                    speakLetter(slot.dataset.char);
                    lettersContainer.classList.add('anim-shake');
                    setTimeout(() => lettersContainer.classList.remove('anim-shake'), 400);
                } else {
                    speakLetter(slot.dataset.char);
                }
                return;
            }

            if (slot.dataset.filled === "true") {
                speakLetter(slot.dataset.char);
                return;
            }

            // ACERTOU!
            if (selectedLetterBtn.dataset.char === slot.dataset.char) {
                playSound('success');
                speakLetter(slot.dataset.char);

                slot.dataset.filled = "true";
                slot.classList.remove('border-dashed', 'border-gray-400', 'bg-gray-200/50', 'text-gray-400', 'shadow-inner');

                const colorClasses = selectedLetterBtn.dataset.colorClass.split(' ');
                slot.classList.add('border-solid', 'border-4', ...colorClasses);
                slot.classList.remove('border-b-8');
                slot.textContent = slot.dataset.char;

                selectedLetterBtn.style.visibility = 'hidden';
                selectedLetterBtn.classList.remove('selected-letter');
                selectedLetterBtn = null;

                correctlyPlacedCount++;

                if (correctlyPlacedCount === currentWord.length) {
                    setTimeout(() => {
                        triggerWin();
                    }, 400);
                }
            } else {
                playSound('error');
                slot.classList.add('anim-shake');
                setTimeout(() => slot.classList.remove('anim-shake'), 400);
            }
        }

        function triggerWin() {
            playSound('win');
            speakText(currentWord);

            emojiDisplay.classList.add('anim-jump');
            lettersContainer.classList.add('hidden');
            nextBtn.classList.remove('hidden');

            startParticles();
        }

        // 5. SÍNTESE DE VOZ DIDÁTICA (Text-To-Speech nativo)
        function speakLetter(char) {
            const letterSound = phoneticLetters[char.toUpperCase()] || char;
            speakText(letterSound, 0.9, 1.25);
        }

        function speakText(text, rate = 0.85, pitch = 1.15) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                utterance.rate = rate;
                utterance.pitch = pitch;

                const voices = window.speechSynthesis.getVoices();
                const ptVoice = voices.find(v => v.lang.includes('pt-BR') || v.lang.includes('pt'));
                if (ptVoice) utterance.voice = ptVoice;

                window.speechSynthesis.speak(utterance);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // 6. SONS SINTÉTICOS (Web Audio API)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'tick':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(700, now);
                    osc.frequency.exponentialRampToValueAtTime(350, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                    break;
                case 'success':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'error':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(140, now + 0.25);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                    break;
                case 'win':
                    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                    notes.forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'sine';
                        o.frequency.value = freq;
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        g.gain.setValueAtTime(0.18, now + i * 0.09);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.09 + 0.28);
                        o.start(now + i * 0.09);
                        o.stop(now + i * 0.09 + 0.28);
                    });
                    break;
            }
        }

        // 7. SISTEMA DE ESTRELAS (Canvas)
        const canvas = document.getElementById('victory-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class StarParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 14 + 4;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.35;
                this.size = Math.random() * 14 + 8;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 12;
                this.life = 1.0;
                this.decay = Math.random() * 0.015 + 0.01;
                const colors = ['#FDE047', '#F97316', '#EC4899', '#06B6D4', '#22C55E'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.vx;
                this.vy += this.gravity;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
                this.life -= this.decay;
            }
            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * this.size,
                               -Math.sin((18 + i * 72) * Math.PI / 180) * this.size);
                    ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (this.size / 2.5),
                               -Math.sin((54 + i * 72) * Math.PI / 180) * (this.size / 2.5));
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        function startParticles() {
            particles = [];
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            for (let i = 0; i < 50; i++) {
                particles.push(new StarParticle(cx, cy));
            }
            if (!animationFrameId) animateParticles();
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let alive = false;
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].life > 0) alive = true;
            }
            if (alive) {
                animationFrameId = requestAnimationFrame(animateParticles);
            } else {
                stopParticles();
            }
        }

        function stopParticles() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = [];
        }

        window.onload = initGame;
    </script>
</body>
</html>
