<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Encaixe dos Números - Matemática Divertida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(180deg, #d1fae5 0%, #ecfdf5 100%);
            touch-action: manipulation;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            height: 100dvh;
            min-height: -webkit-fill-available;
        }

        /* Animação para o botão selecionado (Pulse) */
        @keyframes pulse-select {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            50% { transform: scale(1.12); box-shadow: 0 0 0 12px rgba(255, 255, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }
        .selected-pulse {
            animation: pulse-select 1s infinite;
            border: 4px solid white !important;
        }

        /* Animação de Erro (Shake) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px) rotate(-5deg); }
            40%, 80% { transform: translateX(10px) rotate(5deg); }
        }
        .shake-animation {
            animation: shake 0.5s ease-in-out;
        }

        /* Animação de Sucesso (Dancinha dos Emojis) */
        @keyframes dance {
            0%, 100% { transform: translateY(0) rotate(0); }
            25% { transform: translateY(-15px) rotate(-10deg); }
            50% { transform: translateY(0) rotate(0); }
            75% { transform: translateY(-15px) rotate(10deg); }
        }
        .dance-animation {
            animation: dance 0.6s ease-in-out infinite;
        }

        /* Animação Pop-in suave */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Silhueta escura e nítida para a criança ver bem o número */
        .silhouette-target {
            color: rgba(75, 85, 99, 0.35);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
        }
        
        .math-symbol {
            color: #1f2937;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
        }

        /* Cores vibrantes para os números da bandeja */
        .color-0 { background-color: #FF6B6B; color: white; }
        .color-1 { background-color: #4ECDC4; color: white; }
        .color-2 { background-color: #FFE66D; color: #4b5563; }
        .color-3 { background-color: #FF9F1C; color: white; }
        .color-4 { background-color: #9D4EDD; color: white; }
        
        .hidden-start { display: none !important; }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col items-center justify-between relative overflow-hidden">

    <!-- Tela Inicial -->
    <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-emerald-100 z-50">
        <a href="index.html" class="absolute top-4 left-4 px-4 py-2 bg-white text-emerald-800 text-lg rounded-2xl shadow border-2 border-emerald-200 flex items-center gap-1 font-bold">
            🏠 <span>Menu</span>
        </a>
        <h1 class="text-4xl md:text-6xl font-bold text-emerald-600 mb-6 text-center drop-shadow-md px-4">
            Encaixe dos<br>Números 🔢
        </h1>
        <button onclick="startGame()" class="bg-yellow-400 hover:bg-yellow-300 text-yellow-900 text-2xl md:text-3xl font-bold py-3.5 px-8 md:py-4 md:px-10 rounded-full shadow-xl transform transition hover:scale-105 active:scale-95 pop-in">
            JOGAR!
        </button>
        <p class="mt-6 text-emerald-700/80 font-medium text-base md:text-lg text-center px-6">
            Aprenda a contar e fazer continhas ouvindo cada número!
        </p>
    </div>

    <!-- Interface do Jogo -->
    <div id="game-ui" class="w-full h-full max-w-4xl flex flex-col justify-between hidden-start">
        
        <!-- Cabeçalho (Botão Menu + Título + Progresso + Botão Ouvir) -->
        <header class="w-full px-3 pt-2 md:pt-3 flex justify-between items-center z-20 flex-none">
            <a href="index.html" class="px-3 py-1.5 bg-white hover:bg-gray-50 text-emerald-800 text-sm md:text-base rounded-2xl shadow-md border-2 border-emerald-200 flex items-center gap-1 font-bold active:scale-95">
                🏠 <span>Menu</span>
            </a>
            <div class="flex flex-col items-center">
                <h2 id="phase-title" class="text-base md:text-xl font-bold text-emerald-700 text-center leading-tight">Fase 1: Conhecer os Números</h2>
                <div class="flex justify-center gap-1.5 mt-1" id="progress-dots"></div>
            </div>
            <button id="speak-op-btn" onclick="speakCurrentChallenge()" title="Ouvir a conta" class="px-3 py-1.5 bg-yellow-400 hover:bg-yellow-300 text-yellow-950 text-lg rounded-2xl shadow-md flex items-center gap-1 active:scale-95 font-bold">
                🔊
            </button>
        </header>

        <!-- Área do Desafio (Topo / Central) -->
        <div class="flex-1 flex flex-col items-center justify-center p-2 min-h-0 overflow-hidden">
            <div id="challenge-container" class="flex flex-wrap items-center justify-center gap-2 md:gap-4 text-5xl md:text-7xl">
                <!-- Emojis e Sinais injetados via JS -->
            </div>
        </div>

        <!-- Feedback de Sucesso (Estrelas / Parabéns) -->
        <div id="success-feedback" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none opacity-0 transition-opacity duration-300 z-40 text-center">
            <h3 id="feedback-text" class="text-4xl md:text-7xl font-black text-yellow-400 drop-shadow-[0_4px_6px_rgba(0,0,0,0.35)]">
                MUITO BEM!
            </h3>
        </div>

        <!-- Bandeja de Números (Rodapé - Ajustada para nunca cortar no celular) -->
        <div class="flex-none bg-white/70 backdrop-blur-md rounded-t-3xl px-3 py-3 md:py-5 shadow-[0_-10px_20px_rgba(0,0,0,0.08)] border-t border-white/80 pb-[max(12px,env(safe-area-inset-bottom))]">
            <p class="text-center text-emerald-800 font-bold text-sm md:text-lg mb-2">Toque no número e encaixe:</p>
            <div id="tray-container" class="flex justify-center items-center gap-2 sm:gap-4 md:gap-6 flex-nowrap w-full max-w-md mx-auto">
                <!-- Botões de números injetados via JS -->
            </div>
        </div>
    </div>

    <script>
        // Configurações
        const EMOJIS = ['🍎', '🍌', '🚗', '⭐', '🎈', '🍓', '🐶', '🐸', '🧸'];
        const MAX_PHASES = 4;
        const LEVELS_PER_PHASE = 3;
        
        // Estado do Jogo
        let currentPhase = 1;
        let currentLevel = 0;
        let expectedAnswer = 0;
        let num1 = 0;
        let num2 = 0;
        let currentEmoji = '🍎';
        let selectedNumberEl = null;
        let selectedValue = null;
        let isAnimating = false;

        // Elementos DOM
        const startScreen = document.getElementById('start-screen');
        const gameUI = document.getElementById('game-ui');
        const phaseTitle = document.getElementById('phase-title');
        const challengeContainer = document.getElementById('challenge-container');
        const trayContainer = document.getElementById('tray-container');
        const successFeedback = document.getElementById('success-feedback');
        const feedbackText = document.getElementById('feedback-text');
        const progressDots = document.getElementById('progress-dots');

        // Pronúncias em português por extenso
        const numberNames = {
            0: "zero", 1: "um", 2: "dois", 3: "três", 4: "quatro",
            5: "cinco", 6: "seis", 7: "sete", 8: "oito", 9: "nove",
            10: "dez", 11: "onze", 12: "doze"
        };

        // --- SÍNTESE DE VOZ EDUCATIVA (Text-To-Speech) ---
        function speakText(text, rate = 0.85, pitch = 1.15) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                utterance.rate = rate;
                utterance.pitch = pitch;

                const voices = window.speechSynthesis.getVoices();
                const ptVoice = voices.find(v => v.lang.includes('pt-BR') || v.lang.includes('pt'));
                if (ptVoice) utterance.voice = ptVoice;

                window.speechSynthesis.speak(utterance);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Fala a operação atual (para o botão 🔊 e ao iniciar a fase)
        function speakCurrentChallenge() {
            if (currentPhase === 1) {
                speakText(`Encontre o número ${expectedAnswer}`);
            } else if (currentPhase === 2) {
                speakText(`Quantos itens você está vendo? Conte e encaixe o número!`);
            } else if (currentPhase === 3) {
                speakText(`Quanto é ${num1} mais ${num2}?`);
            } else if (currentPhase === 4) {
                speakText(`Quanto é ${num1} menos ${num2}?`);
            }
        }

        // --- SISTEMA DE SOM (Web Audio API) ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(0.25, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'error') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.35);
                gainNode.gain.setValueAtTime(0.25, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'success') {
                osc.type = 'sine';
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.15);
                osc.frequency.setValueAtTime(659.25, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        // --- LÓGICA DO JOGO ---
        function startGame() {
            initAudio();
            startScreen.classList.add('hidden-start');
            gameUI.classList.remove('hidden-start');
            currentPhase = 1;
            currentLevel = 0;
            loadLevel();
        }

        function updateProgress() {
            progressDots.innerHTML = '';
            for (let i = 0; i < LEVELS_PER_PHASE; i++) {
                const dot = document.createElement('div');
                dot.className = `w-3.5 h-3.5 rounded-full ${i < currentLevel ? 'bg-yellow-400 shadow' : 'bg-emerald-300/60'}`;
                progressDots.appendChild(dot);
            }
        }

        function getPhaseTitle() {
            switch(currentPhase) {
                case 1: return "Fase 1: Conhecer os Números";
                case 2: return "Fase 2: Quantos tem aí?";
                case 3: return "Fase 3: Juntar (Somar +)";
                case 4: return "Fase 4: Tirar (Subtrair -)";
                default: return "Matemática Divertida";
            }
        }

        function createEmojiGroup(count, emoji, animateClass = '') {
            let html = `<div class="flex flex-wrap justify-center items-center max-w-[150px] md:max-w-[280px] gap-1.5 cursor-pointer" title="Toque para contar" onclick="speakText('${count}')">`;
            for (let i = 0; i < count; i++) {
                html += `<span class="emoji-item text-5xl md:text-7xl ${animateClass} drop-shadow">${emoji}</span>`;
            }
            html += `</div>`;
            return html;
        }

        function loadLevel() {
            isAnimating = false;
            selectedValue = null;
            selectedNumberEl = null;
            
            phaseTitle.innerText = getPhaseTitle();
            updateProgress();
            
            currentEmoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
            challengeContainer.innerHTML = '';

            if (currentPhase === 1) {
                // Reconhecimento
                expectedAnswer = Math.floor(Math.random() * 9) + 1;
                challengeContainer.innerHTML = `
                    <div id="target-box" class="w-24 h-32 md:w-32 md:h-40 border-4 md:border-8 border-dashed border-gray-400 rounded-3xl bg-gray-200/50 flex items-center justify-center cursor-pointer transition-colors hover:bg-gray-200/70 shadow-inner" onclick="handleTargetClick()">
                        <span class="text-7xl md:text-9xl font-black silhouette-target">${expectedAnswer}</span>
                    </div>
                `;
            } 
            else if (currentPhase === 2) {
                // Contagem
                expectedAnswer = Math.floor(Math.random() * 8) + 1;
                challengeContainer.innerHTML = `
                    ${createEmojiGroup(expectedAnswer, currentEmoji)}
                    <span class="math-symbol font-black mx-2 text-5xl md:text-7xl">=</span>
                    <div id="target-box" class="w-24 h-32 md:w-32 md:h-40 border-4 md:border-8 border-dashed border-gray-400 rounded-3xl bg-gray-200/50 flex items-center justify-center cursor-pointer transition-colors hover:bg-gray-200/70 shadow-inner" onclick="handleTargetClick()">
                        <span class="text-7xl md:text-9xl font-black silhouette-target">${expectedAnswer}</span>
                    </div>
                `;
            }
            else if (currentPhase === 3) {
                // Soma Visual
                num1 = Math.floor(Math.random() * 4) + 1;
                num2 = Math.floor(Math.random() * 4) + 1;
                expectedAnswer = num1 + num2;
                challengeContainer.innerHTML = `
                    ${createEmojiGroup(num1, currentEmoji)}
                    <span class="math-symbol font-black mx-1.5 text-5xl md:text-7xl">+</span>
                    ${createEmojiGroup(num2, currentEmoji)}
                    <span class="math-symbol font-black mx-1.5 text-5xl md:text-7xl">=</span>
                    <div id="target-box" class="w-22 h-28 sm:w-26 sm:h-34 md:w-32 md:h-40 border-4 md:border-8 border-dashed border-gray-400 rounded-3xl bg-gray-200/50 flex items-center justify-center cursor-pointer transition-colors hover:bg-gray-200/70 shadow-inner" onclick="handleTargetClick()">
                        <span class="text-6xl md:text-8xl font-black silhouette-target">${expectedAnswer}</span>
                    </div>
                `;
            }
            else if (currentPhase === 4) {
                // Subtração Visual
                num1 = Math.floor(Math.random() * 5) + 3; // 3 a 7
                num2 = Math.floor(Math.random() * (num1 - 1)) + 1; // 1 a num1-1
                expectedAnswer = num1 - num2;
                challengeContainer.innerHTML = `
                    ${createEmojiGroup(num1, currentEmoji)}
                    <span class="math-symbol font-black mx-1.5 text-5xl md:text-7xl">-</span>
                    ${createEmojiGroup(num2, currentEmoji)}
                    <span class="math-symbol font-black mx-1.5 text-5xl md:text-7xl">=</span>
                    <div id="target-box" class="w-22 h-28 sm:w-26 sm:h-34 md:w-32 md:h-40 border-4 md:border-8 border-dashed border-gray-400 rounded-3xl bg-gray-200/50 flex items-center justify-center cursor-pointer transition-colors hover:bg-gray-200/70 shadow-inner" onclick="handleTargetClick()">
                        <span class="text-6xl md:text-8xl font-black silhouette-target">${expectedAnswer}</span>
                    </div>
                `;
            }

            renderTray(expectedAnswer);

            // Fala o desafio logo ao entrar na fase
            setTimeout(speakCurrentChallenge, 400);
        }

        function renderTray(correct) {
            trayContainer.innerHTML = '';
            let options = [correct];
            while (options.length < 4) {
                let rand = Math.floor(Math.random() * 9) + 1;
                if (!options.includes(rand)) {
                    options.push(rand);
                }
            }
            options.sort(() => Math.random() - 0.5);

            options.forEach((num, index) => {
                const btn = document.createElement('button');
                const colorClass = `color-${index % 5}`;
                
                // Botões proporcionais que cabem os 4 lado a lado no celular sem quebrar
                btn.className = `${colorClass} w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 rounded-2xl md:rounded-3xl shadow-lg md:shadow-xl text-3xl sm:text-4xl md:text-5xl font-black flex items-center justify-center cursor-pointer transform transition-transform duration-200 pop-in border-2 md:border-4 border-transparent active:scale-95 flex-none`;
                btn.innerText = num;
                btn.onclick = () => handleTrayClick(num, btn);
                trayContainer.appendChild(btn);
            });
        }

        // AO CLICAR NA BANDEJA: PRONUNCIA O NÚMERO
        function handleTrayClick(val, element) {
            if (isAnimating) return;
            
            playSound('select');
            
            // FALA O NÚMERO SELECIONADO IMEDIATAMENTE
            const nomeNumero = numberNames[val] || String(val);
            speakText(nomeNumero);

            if (selectedNumberEl) {
                selectedNumberEl.classList.remove('selected-pulse');
            }
            
            selectedValue = val;
            selectedNumberEl = element;
            selectedNumberEl.classList.add('selected-pulse');
            
            const target = document.getElementById('target-box');
            if (target) {
                target.classList.add('scale-105');
                setTimeout(() => target.classList.remove('scale-105'), 200);
            }
        }

        // AO CLICAR NO ALVO (ENCAIXE)
        function handleTargetClick() {
            if (isAnimating) return;

            // Se ainda não escolheu número na bandeja, fala a pergunta
            if (selectedValue === null) {
                speakCurrentChallenge();
                return;
            }

            const targetBox = document.getElementById('target-box');

            if (selectedValue === expectedAnswer) {
                // ACERTOU!
                isAnimating = true;
                playSound('success');
                
                targetBox.innerHTML = `<span class="text-7xl md:text-9xl font-black text-white drop-shadow-md pop-in">${expectedAnswer}</span>`;
                targetBox.className = "w-24 h-32 md:w-32 md:h-40 border-4 md:border-8 border-transparent rounded-3xl bg-green-500 flex items-center justify-center pop-in shadow-2xl";
                
                selectedNumberEl.style.opacity = '0';
                selectedNumberEl.style.transform = 'scale(0)';

                document.querySelectorAll('.emoji-item').forEach(el => {
                    el.classList.add('dance-animation');
                });

                // DESCREVE A OPERAÇÃO MATEMÁTICA FALADA
                let spokenExplanation = "";
                if (currentPhase === 1) {
                    spokenExplanation = `Muito bem! Esse é o número ${expectedAnswer}!`;
                } else if (currentPhase === 2) {
                    spokenExplanation = `Muito bem! São ${expectedAnswer} itens!`;
                } else if (currentPhase === 3) {
                    // Exemplo: "2 mais 3 é igual a 5!"
                    spokenExplanation = `${num1} mais ${num2} é igual a ${expectedAnswer}! Muito bem!`;
                } else if (currentPhase === 4) {
                    // Exemplo: "6 menos 2 é igual a 4!"
                    spokenExplanation = `${num1} menos ${num2} é igual a ${expectedAnswer}! Muito bem!`;
                }

                feedbackText.innerText = "MUITO BEM!";
                successFeedback.style.opacity = '1';
                successFeedback.classList.add('pop-in');

                // Pronuncia a conta explicada
                setTimeout(() => {
                    speakText(spokenExplanation);
                }, 300);

                setTimeout(() => {
                    successFeedback.style.opacity = '0';
                    successFeedback.classList.remove('pop-in');
                    
                    currentLevel++;
                    if (currentLevel >= LEVELS_PER_PHASE) {
                        currentLevel = 0;
                        currentPhase++;
                    }

                    if (currentPhase > MAX_PHASES) {
                        endGame();
                    } else {
                        loadLevel();
                    }
                }, 3200);

            } else {
                // ERROU!
                isAnimating = true;
                playSound('error');
                
                speakText("Tente outro número!");

                selectedNumberEl.classList.add('shake-animation');
                selectedNumberEl.classList.remove('selected-pulse');
                targetBox.classList.add('bg-red-200/50');
                
                setTimeout(() => {
                    selectedNumberEl.classList.remove('shake-animation');
                    targetBox.classList.remove('bg-red-200/50');
                    selectedNumberEl = null;
                    selectedValue = null;
                    isAnimating = false;
                }, 500);
            }
        }

        function endGame() {
            challengeContainer.innerHTML = `
                <div class="flex flex-col items-center pop-in">
                    <h2 class="text-5xl md:text-6xl font-black text-yellow-500 mb-3 drop-shadow-md">Parabéns! 🏆</h2>
                    <p class="text-xl md:text-2xl text-emerald-800 font-bold mb-6 text-center">Você é um campeão da matemática!</p>
                    <div class="flex gap-4 mb-6">
                        <span class="text-6xl dance-animation">⭐</span>
                        <span class="text-8xl dance-animation">🎉</span>
                        <span class="text-6xl dance-animation">⭐</span>
                    </div>
                    <button onclick="startGame()" class="bg-emerald-500 hover:bg-emerald-400 text-white text-2xl font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95">
                        Jogar Novamente
                    </button>
                </div>
            `;
            trayContainer.innerHTML = '';
            phaseTitle.innerText = "Fim de Jogo!";
            progressDots.innerHTML = '';
            speakText("Parabéns! Você completou todas as continhas!");
        }
    </script>
</body>
</html>
