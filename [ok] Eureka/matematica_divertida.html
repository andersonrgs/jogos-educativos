<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Encaixe dos Números - Matemática Divertida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #d1fae5; /* Verde menta muito claro */
            touch-action: manipulation; /* Evita zoom duplo em telas touch */
            overflow: hidden; /* Evita rolagem */
        }

        /* Animação para o botão selecionado (Pulse) */
        @keyframes pulse-select {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }
        .selected-pulse {
            animation: pulse-select 1s infinite;
            border: 4px solid white;
        }

        /* Animação de Erro (Shake) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px) rotate(-5deg); }
            40%, 80% { transform: translateX(10px) rotate(5deg); }
        }
        .shake-animation {
            animation: shake 0.5s ease-in-out;
        }

        /* Animação de Sucesso (Dancinha dos Emojis) */
        @keyframes dance {
            0%, 100% { transform: translateY(0) rotate(0); }
            25% { transform: translateY(-15px) rotate(-10deg); }
            50% { transform: translateY(0) rotate(0); }
            75% { transform: translateY(-15px) rotate(10deg); }
        }
        .dance-animation {
            animation: dance 0.6s ease-in-out infinite;
        }

        /* Animação Pop-in suave */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Silhueta translúcida */
        .silhouette-target {
            color: rgba(156, 163, 175, 0.3); /* Cinza translúcido */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .math-symbol {
            color: #4b5563; /* Cinza escuro amigável */
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
        }

        /* Cores vibrantes para os números da bandeja */
        .color-0 { background-color: #FF6B6B; color: white; }
        .color-1 { background-color: #4ECDC4; color: white; }
        .color-2 { background-color: #FFE66D; color: #4b5563; }
        .color-3 { background-color: #FF9F1C; color: white; }
        .color-4 { background-color: #9D4EDD; color: white; }
        
        /* Ocultar elementos iniciais */
        .hidden-start { display: none !important; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- Tela Inicial -->
    <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-emerald-100 z-50">
        <h1 class="text-5xl md:text-6xl font-bold text-emerald-600 mb-8 text-center drop-shadow-md px-4">
            Encaixe dos<br>Números
        </h1>
        <button onclick="startGame()" class="bg-yellow-400 hover:bg-yellow-300 text-yellow-900 text-3xl font-bold py-4 px-10 rounded-full shadow-xl transform transition hover:scale-105 active:scale-95 pop-in">
            JOGAR!
        </button>
        <p class="mt-8 text-emerald-600/80 font-medium text-lg text-center px-6">
            Aprenda a contar de forma divertida!
        </p>
    </div>

    <!-- Interface do Jogo -->
    <div id="game-ui" class="w-full h-full max-w-4xl flex flex-col hidden-start pb-6">
        
        <!-- Cabeçalho / Progresso -->
        <div class="flex-none p-4 text-center">
            <h2 id="phase-title" class="text-3xl font-bold text-emerald-600 pop-in">Fase 1: Reconhecer</h2>
            <div class="flex justify-center gap-2 mt-2" id="progress-dots">
                <!-- Bolinhas de progresso injetadas via JS -->
            </div>
        </div>

        <!-- Área do Desafio (Topo) -->
        <div class="flex-1 flex flex-col items-center justify-center p-4 min-h-[40vh]">
            <div id="challenge-container" class="flex flex-wrap items-center justify-center gap-4 text-6xl md:text-8xl">
                <!-- Emojis e Sinais injetados via JS -->
            </div>
        </div>

        <!-- Feedback de Sucesso (Estrelas / Parabéns) -->
        <div id="success-feedback" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none opacity-0 transition-opacity duration-300 z-40">
            <h3 class="text-6xl md:text-8xl font-black text-yellow-400 drop-shadow-[0_4px_4px_rgba(0,0,0,0.3)] filter">
                MUITO BEM!
            </h3>
        </div>

        <!-- Bandeja de Números (Rodapé) -->
        <div class="flex-none bg-white/40 backdrop-blur-sm rounded-t-3xl p-6 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] border-t border-white/60">
            <p class="text-center text-emerald-700 font-semibold text-xl mb-4">Escolha o número e encaixe:</p>
            <div id="tray-container" class="flex justify-center items-center gap-4 md:gap-8 flex-wrap">
                <!-- Botões de números injetados via JS -->
            </div>
        </div>
    </div>

    <script>
        // Configurações do Jogo
        const EMOJIS = ['🍎', '🍌', '🚗', '⭐', '🎈', '🍓', '🐶'];
        const MAX_PHASES = 4;
        const LEVELS_PER_PHASE = 3;
        
        // Estado do Jogo
        let currentPhase = 1;
        let currentLevel = 0;
        let expectedAnswer = 0;
        let selectedNumberEl = null;
        let selectedValue = null;
        let isAnimating = false; // Previne cliques durante animações

        // Elementos DOM
        const startScreen = document.getElementById('start-screen');
        const gameUI = document.getElementById('game-ui');
        const phaseTitle = document.getElementById('phase-title');
        const challengeContainer = document.getElementById('challenge-container');
        const trayContainer = document.getElementById('tray-container');
        const successFeedback = document.getElementById('success-feedback');
        const progressDots = document.getElementById('progress-dots');

        // --- SISTEMA DE SOM (Web Audio API) ---
        // Cria sons simples sem precisar de arquivos externos.
        let audioCtx;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if(audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'select') {
                // Som de "Blip" ao escolher na bandeja
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'error') {
                // Som de "Boing/Mola" suave ao errar
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'success') {
                // Arpejo de comemoração
                osc.type = 'sine';
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                
                // Nota 1
                osc.frequency.setValueAtTime(440, now);
                // Nota 2
                osc.frequency.setValueAtTime(554.37, now + 0.15);
                // Nota 3
                osc.frequency.setValueAtTime(659.25, now + 0.3);
                
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        // --- LÓGICA DO JOGO ---

        function startGame() {
            initAudio();
            startScreen.classList.add('hidden-start');
            gameUI.classList.remove('hidden-start');
            currentPhase = 1;
            currentLevel = 0;
            loadLevel();
        }

        function updateProgress() {
            progressDots.innerHTML = '';
            for (let i = 0; i < LEVELS_PER_PHASE; i++) {
                const dot = document.createElement('div');
                dot.className = `w-4 h-4 rounded-full ${i < currentLevel ? 'bg-yellow-400' : 'bg-emerald-300/50'}`;
                progressDots.appendChild(dot);
            }
        }

        function getPhaseTitle() {
            switch(currentPhase) {
                case 1: return "Fase 1: Reconhecer os Números!";
                case 2: return "Fase 2: Quantos tem aí?";
                case 3: return "Fase 3: Juntar (Somar)";
                case 4: return "Fase 4: Tirar (Subtrair)";
                default: return "Matemática Divertida";
            }
        }

        // Cria a representação visual dos itens em tela
        function createEmojiGroup(count, emoji, animateClass = '') {
            let html = `<div class="flex flex-wrap justify-center items-center max-w-[150px] md:max-w-[300px] gap-2">`;
            for (let i = 0; i < count; i++) {
                html += `<span class="emoji-item text-5xl md:text-7xl ${animateClass}">${emoji}</span>`;
            }
            html += `</div>`;
            return html;
        }

        function loadLevel() {
            isAnimating = false;
            selectedValue = null;
            selectedNumberEl = null;
            
            phaseTitle.innerText = getPhaseTitle();
            updateProgress();
            
            const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
            let num1, num2;

            challengeContainer.innerHTML = '';

            // Configurações por Fase
            if (currentPhase === 1) {
                // Apenas silhueta
                expectedAnswer = Math.floor(Math.random() * 9) + 1; // 1 a 9
                
                challengeContainer.innerHTML = `
                    <div id="target-box" class="w-32 h-40 border-8 border-dashed border-gray-400/40 rounded-3xl bg-gray-200/30 flex items-center justify-center cursor-pointer transition-colors hover:bg-gray-200/50" onclick="handleTargetClick()">
                        <span class="text-8xl md:text-9xl font-black silhouette-target">${expectedAnswer}</span>
                    </div>
                `;
            } 
            else if (currentPhase === 2) {
                // Contagem
                expectedAnswer = Math.floor(Math.random() * 8) + 1; // 1 a 8
                
                challengeContainer.innerHTML = `
                    ${createEmojiGroup(expectedAnswer, emoji)}
                    <span class="math-symbol font-black mx-4">=</span>
                    <div id="target-box" class="w-32 h-40 border-8 border-dashed border-gray-400/40 rounded-3xl bg-gray-200/30 flex items-center justify-center cursor-pointer transition-colors hover:bg-gray-200/50" onclick="handleTargetClick()">
                        <span class="text-8xl md:text-9xl font-black silhouette-target">${expectedAnswer}</span>
                    </div>
                `;
            }
            else if (currentPhase === 3) {
                // Soma Visual
                num1 = Math.floor(Math.random() * 4) + 1; // 1 a 4
                num2 = Math.floor(Math.random() * 4) + 1; // 1 a 4
                expectedAnswer = num1 + num2;
                
                challengeContainer.innerHTML = `
                    ${createEmojiGroup(num1, emoji)}
                    <span class="math-symbol font-black mx-2 text-7xl">+</span>
                    ${createEmojiGroup(num2, emoji)}
                    <span class="math-symbol font-black mx-2 text-7xl">=</span>
                    <div id="target-box" class="w-28 h-36 md:w-32 md:h-40 border-8 border-dashed border-gray-400/40 rounded-3xl bg-gray-200/30 flex items-center justify-center cursor-pointer transition-colors hover:bg-gray-200/50" onclick="handleTargetClick()">
                        <span class="text-7xl md:text-9xl font-black silhouette-target">${expectedAnswer}</span>
                    </div>
                `;
            }
            else if (currentPhase === 4) {
                // Subtração Visual
                num1 = Math.floor(Math.random() * 5) + 3; // 3 a 7
                num2 = Math.floor(Math.random() * (num1 - 1)) + 1; // 1 a (num1-1)
                expectedAnswer = num1 - num2;
                
                challengeContainer.innerHTML = `
                    ${createEmojiGroup(num1, emoji)}
                    <span class="math-symbol font-black mx-2 text-7xl">-</span>
                    ${createEmojiGroup(num2, emoji)}
                    <span class="math-symbol font-black mx-2 text-7xl">=</span>
                    <div id="target-box" class="w-28 h-36 md:w-32 md:h-40 border-8 border-dashed border-gray-400/40 rounded-3xl bg-gray-200/30 flex items-center justify-center cursor-pointer transition-colors hover:bg-gray-200/50" onclick="handleTargetClick()">
                        <span class="text-7xl md:text-9xl font-black silhouette-target">${expectedAnswer}</span>
                    </div>
                `;
            }

            renderTray(expectedAnswer);
        }

        function renderTray(correct) {
            trayContainer.innerHTML = '';
            
            // Gera 4 opções (1 correta, 3 incorretas únicas)
            let options = [correct];
            while(options.length < 4) {
                let rand = Math.floor(Math.random() * 9) + 1;
                if(!options.includes(rand) && rand >= 0) {
                    options.push(rand);
                }
            }
            
            // Embaralha array
            options.sort(() => Math.random() - 0.5);

            options.forEach((num, index) => {
                const btn = document.createElement('button');
                // Adiciona cor baseada no índice para ser colorido e alegre
                const colorClass = `color-${index % 5}`;
                
                btn.className = `${colorClass} w-20 h-20 md:w-24 md:h-24 rounded-full shadow-lg text-4xl md:text-6xl font-black flex items-center justify-center cursor-pointer transform transition-transform duration-200 pop-in border-4 border-transparent`;
                btn.innerText = num;
                btn.onclick = () => handleTrayClick(num, btn);
                trayContainer.appendChild(btn);
            });
        }

        function handleTrayClick(val, element) {
            if (isAnimating) return;
            
            playSound('select');
            
            // Remove seleção anterior
            if (selectedNumberEl) {
                selectedNumberEl.classList.remove('selected-pulse');
            }
            
            // Define nova seleção
            selectedValue = val;
            selectedNumberEl = element;
            selectedNumberEl.classList.add('selected-pulse');
            
            // Pequeno feedback visual no alvo chamando a atenção
            const target = document.getElementById('target-box');
            if (target) {
                target.classList.add('scale-105');
                setTimeout(() => target.classList.remove('scale-105'), 200);
            }
        }

        function handleTargetClick() {
            if (isAnimating || selectedValue === null) return;

            const targetBox = document.getElementById('target-box');

            if (selectedValue === expectedAnswer) {
                // ACERTOU!
                isAnimating = true;
                playSound('success');
                
                // Preenche o alvo perfeitamente
                targetBox.innerHTML = `<span class="text-8xl md:text-9xl font-black text-white drop-shadow-md pop-in">${expectedAnswer}</span>`;
                targetBox.className = "w-32 h-40 border-8 border-transparent rounded-3xl bg-green-400 flex items-center justify-center pop-in shadow-xl";
                
                // Remove o número da bandeja visualmente
                selectedNumberEl.style.opacity = '0';
                selectedNumberEl.style.transform = 'scale(0)';

                // Dancinha dos Emojis
                document.querySelectorAll('.emoji-item').forEach(el => {
                    el.classList.add('dance-animation');
                });

                // Mostra feedback "MUITO BEM"
                successFeedback.style.opacity = '1';
                successFeedback.classList.add('pop-in');

                setTimeout(() => {
                    successFeedback.style.opacity = '0';
                    successFeedback.classList.remove('pop-in');
                    
                    currentLevel++;
                    if (currentLevel >= LEVELS_PER_PHASE) {
                        currentLevel = 0;
                        currentPhase++;
                    }

                    if (currentPhase > MAX_PHASES) {
                        endGame();
                    } else {
                        loadLevel();
                    }
                }, 2500);

            } else {
                // ERROU!
                isAnimating = true;
                playSound('error');
                
                // Faz o número selecionado tremer
                selectedNumberEl.classList.add('shake-animation');
                selectedNumberEl.classList.remove('selected-pulse');
                
                // Alvo pisca levemente em vermelho para indicar rejeição
                targetBox.classList.add('bg-red-200/50');
                
                setTimeout(() => {
                    selectedNumberEl.classList.remove('shake-animation');
                    targetBox.classList.remove('bg-red-200/50');
                    selectedNumberEl = null;
                    selectedValue = null;
                    isAnimating = false;
                }, 500);
            }
        }

        function endGame() {
            challengeContainer.innerHTML = `
                <div class="flex flex-col items-center pop-in">
                    <h2 class="text-6xl font-black text-yellow-500 mb-4 drop-shadow-md">Parabéns!</h2>
                    <p class="text-2xl text-emerald-700 font-bold mb-8 text-center">Você completou todas as fases!</p>
                    <div class="flex gap-4 mb-8">
                        <span class="text-6xl dance-animation delay-100">⭐</span>
                        <span class="text-8xl dance-animation">🏆</span>
                        <span class="text-6xl dance-animation delay-200">⭐</span>
                    </div>
                    <button onclick="startGame()" class="bg-emerald-500 hover:bg-emerald-400 text-white text-2xl font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105">
                        Jogar Novamente
                    </button>
                </div>
            `;
            trayContainer.innerHTML = '';
            phaseTitle.innerText = "Fim de Jogo!";
            progressDots.innerHTML = '';
        }

    </script>
</body>
</html>
