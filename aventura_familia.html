<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aventura da Família - Super Heróis Saudáveis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: #0f172a;
            min-height: 100dvh;
            height: 100dvh;
            overflow: hidden;
            position: relative;
        }

        /* Botões de controle touch responsivos */
        .touch-btn {
            background: rgba(255, 255, 255, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
            color: #ffffff;
            font-size: 2rem;
            font-weight: 900;
            transition: transform 0.08s, background 0.08s;
        }

        .touch-btn:active, .touch-btn.pressed {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.7);
        }

        .jump-btn {
            background: rgba(34, 197, 94, 0.75);
            border-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.45);
        }

        .jump-btn:active, .jump-btn.pressed {
            background: rgba(34, 197, 94, 0.98);
        }

        .hidden-screen { display: none !important; }
    </style>
</head>
<body class="w-screen h-[100dvh] flex flex-col justify-between items-center relative overflow-hidden">

    <!-- Canvas Principal do Jogo -->
    <canvas id="gameCanvas" class="absolute inset-0 w-full h-full z-0 block"></canvas>

    <!-- Tela de Seleção de Personagem -->
    <div id="char-select-screen" class="absolute inset-0 z-40 bg-sky-950/90 backdrop-blur-md flex flex-col items-center justify-between p-4 sm:p-6 text-center">
        <a href="index.html" class="self-start px-4 py-2 bg-white/90 hover:bg-white text-sky-900 text-lg rounded-2xl shadow border-2 border-sky-300 flex items-center gap-1 font-bold">
            🏠 <span>Menu</span>
        </a>

        <div class="my-auto max-w-2xl w-full">
            <h1 class="text-3xl sm:text-5xl font-black text-yellow-300 drop-shadow-[0_4px_8px_rgba(0,0,0,0.5)] mb-2">
                Aventura da Família! 🍎🍄⭐
            </h1>
            <p class="text-base sm:text-2xl text-white font-bold mb-6">
                Colete frutas e comidas saudáveis! Quem vai jogar?
            </p>

            <!-- Cards dos 4 Personagens com gráficos realistas -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 w-full">
                <!-- Henrique (Homem-Aranha) -->
                <button onclick="selectCharacter('henrique')" class="char-card bg-white hover:bg-yellow-50 border-4 border-red-500 rounded-3xl p-3 flex flex-col items-center shadow-2xl active:scale-95 transition-all">
                    <div class="w-20 h-28 sm:w-24 sm:h-32 flex items-center justify-center">
                        <canvas id="preview-henrique" width="90" height="110"></canvas>
                    </div>
                    <span class="text-base sm:text-xl font-black text-red-600 mt-1">Henrique</span>
                    <span class="text-xs font-bold text-gray-500">🕷️ Homem-Aranha</span>
                </button>

                <!-- Papai Anderson -->
                <button onclick="selectCharacter('anderson')" class="char-card bg-white hover:bg-yellow-50 border-4 border-blue-600 rounded-3xl p-3 flex flex-col items-center shadow-2xl active:scale-95 transition-all">
                    <div class="w-20 h-28 sm:w-24 sm:h-32 flex items-center justify-center">
                        <canvas id="preview-anderson" width="90" height="110"></canvas>
                    </div>
                    <span class="text-base sm:text-xl font-black text-blue-700 mt-1">Pai Anderson</span>
                    <span class="text-xs font-bold text-gray-500">🧔 Barba & Grisalho</span>
                </button>

                <!-- Mamãe -->
                <button onclick="selectCharacter('mamae')" class="char-card bg-white hover:bg-yellow-50 border-4 border-pink-500 rounded-3xl p-3 flex flex-col items-center shadow-2xl active:scale-95 transition-all">
                    <div class="w-20 h-28 sm:w-24 sm:h-32 flex items-center justify-center">
                        <canvas id="preview-mamae" width="90" height="110"></canvas>
                    </div>
                    <span class="text-base sm:text-xl font-black text-pink-600 mt-1">Mamãe</span>
                    <span class="text-xs font-bold text-gray-500">👓 Blusa Rosa & Jeans</span>
                </button>

                <!-- Vovó -->
                <button onclick="selectCharacter('vovo')" class="char-card bg-white hover:bg-yellow-50 border-4 border-purple-500 rounded-3xl p-3 flex flex-col items-center shadow-2xl active:scale-95 transition-all">
                    <div class="w-20 h-28 sm:w-24 sm:h-32 flex items-center justify-center">
                        <canvas id="preview-vovo" width="90" height="110"></canvas>
                    </div>
                    <span class="text-base sm:text-xl font-black text-purple-700 mt-1">Vovó</span>
                    <span class="text-xs font-bold text-gray-500">👵 Óculos & Xale</span>
                </button>
            </div>
        </div>

        <p class="text-xs sm:text-sm text-yellow-200/90 font-bold">
            Pule de cabeça nos blocos [?] para descobrir frutas saudáveis que dão super poderes! 🍎🍌
        </p>
    </div>

    <!-- Interface Superior HUD -->
    <header class="w-full max-w-4xl px-3 pt-3 flex justify-between items-center z-20 flex-none pointer-events-auto">
        <div class="flex items-center gap-2">
            <a href="index.html" class="px-3.5 py-1.5 bg-white/90 hover:bg-white text-sky-800 text-sm sm:text-base rounded-2xl shadow-md border-2 border-sky-200 flex items-center gap-1 font-bold active:scale-95">
                🏠 <span>Menu</span>
            </a>
            <button onclick="openCharSelect()" class="px-3 py-1.5 bg-yellow-400 hover:bg-yellow-300 text-yellow-950 text-xs sm:text-sm rounded-2xl shadow font-black flex items-center gap-1 active:scale-95">
                🔄 <span>Trocar</span>
            </button>
        </div>

        <!-- Indicador de Fase e Alimentos Saudáveis -->
        <div class="flex items-center gap-2 sm:gap-3 bg-black/50 backdrop-blur-md px-3.5 py-1.5 rounded-2xl border border-white/30 text-white font-black text-xs sm:text-sm shadow-lg">
            <span id="phase-badge" class="bg-amber-500 text-amber-950 px-2 py-0.5 rounded-full text-xs">Fase 1: O Parque</span>
            <span class="flex items-center gap-1">🍎 <span id="fruits-count" class="text-green-300">0</span></span>
            <span class="flex items-center gap-1">⭐ <span id="stars-count" class="text-yellow-300">0</span></span>
            <span id="char-name-badge" class="bg-red-500 px-2 py-0.5 rounded-full ml-1">Henrique</span>
        </div>
    </header>

    <!-- Controles Touch na Tela -->
    <div id="touch-controls" class="w-full max-w-4xl px-4 pb-4 flex justify-between items-end z-20 flex-none pointer-events-none pb-[max(16px,env(safe-area-inset-bottom))]">
        <div class="flex gap-3 pointer-events-auto">
            <button id="btn-left" class="touch-btn w-16 h-16 sm:w-20 sm:h-20" aria-label="Esquerda">◀</button>
            <button id="btn-right" class="touch-btn w-16 h-16 sm:w-20 sm:h-20" aria-label="Direita">▶</button>
        </div>
        <div class="pointer-events-auto">
            <button id="btn-jump" class="touch-btn jump-btn w-20 h-20 sm:w-24 sm:h-24 text-base sm:text-lg font-black tracking-wider" aria-label="Pular">
                PULAR!
            </button>
        </div>
    </div>

    <!-- Overlay de Conclusão de Fase / Avançar -->
    <div id="win-overlay" class="absolute inset-0 bg-black/80 backdrop-blur-md hidden-screen flex flex-col items-center justify-center z-50 p-6 text-center">
        <div class="text-8xl mb-3 animate-bounce" id="win-icon">🏆🏰✨</div>
        <h2 id="win-title" class="text-3xl sm:text-5xl font-black text-yellow-300 mb-2 drop-shadow-md">
            MUITO BEM!
        </h2>
        <p id="win-desc" class="text-base sm:text-xl text-white font-bold mb-6 max-w-md">
            Você coletou muitas frutas saudáveis e completou a fase!
        </p>
        <button id="win-next-btn" onclick="nextPhaseOrRestart()" class="bg-green-500 hover:bg-green-400 text-white text-xl sm:text-2xl font-black py-3.5 px-10 rounded-full shadow-2xl transform transition hover:scale-105 active:scale-95">
            Próxima Fase ▶
        </button>
    </div>

    <script>
        /**
         * MOTOR DE JOGO DE PLATAFORMA - COM PERSONAGENS REALISTAS E ALIMENTOS SAUDÁVEIS
         */

        // Carregamento do Avatar Real do Henrique
        const henriqueImg = new Image();
        henriqueImg.src = 'avatar_henrique.png';
        let henriqueImgLoaded = false;
        henriqueImg.onload = () => {
            henriqueImgLoaded = true;
            renderPreviews();
        };

        let audioCtx = null;
        let selectedHero = 'henrique';
        let currentPhaseIndex = 0; // 0: Parque, 1: Praia, 2: Noite Estrelada
        let fruitsCollected = 0;
        let starsCollected = 0;
        let gameRunning = false;

        // Fases com Temáticas Visuais Ricas
        const PHASES = [
            {
                name: "Fase 1: Parque da Primavera",
                theme: "park",
                skyTop: "#38bdf8",
                skyBottom: "#bae6fd",
                groundTop: "#22c55e",
                groundBottom: "#78350f",
                hillColor: "#16a34a",
                castleColor: "#e2e8f0"
            },
            {
                name: "Fase 2: Praia no Pôr do Sol",
                theme: "beach",
                skyTop: "#f97316",
                skyBottom: "#fef08a",
                groundTop: "#facc15", // Areia dourada
                groundBottom: "#ca8a04",
                hillColor: "#0284c7", // Ondas do mar
                castleColor: "#fde047" // Castelo de areia
            },
            {
                name: "Fase 3: Noite Estrelada da Família",
                theme: "night",
                skyTop: "#0f172a",
                skyBottom: "#1e1b4b",
                groundTop: "#8b5cf6", // Chão de cristal mágico
                groundBottom: "#4c1d95",
                hillColor: "#312e81",
                castleColor: "#c084fc"
            }
        ];

        // Banco de Alimentos e Frutas Saudáveis nos Blocos
        const HEALTHY_FOODS = [
            { name: "Maçã", emoji: "🍎", phrase: "Você achou uma Maçã fresquinha! Dá muita energia!" },
            { name: "Banana", emoji: "🍌", phrase: "Banana gostosa para os músculos ficarem fortes!" },
            { name: "Morango", emoji: "🍓", phrase: "Moranguinho delicioso e cheio de vitaminas!" },
            { name: "Melancia", emoji: "🍉", phrase: "Melancia refrescante para hidratar o corpo!" },
            { name: "Cenoura", emoji: "🥕", phrase: "Cenoura crocante, excelente para a visão!" },
            { name: "Uva", emoji: "🍇", phrase: "Uvinhas roxas deliciosas!" },
            { name: "Laranja", emoji: "🍊", phrase: "Laranja cheia de vitamina C!" },
            { name: "Abacate", emoji: "🥑", phrase: "Abacate super saudável e nutritivo!" }
        ];

        // Elementos DOM
        const fruitsCountEl = document.getElementById('fruits-count');
        const starsCountEl = document.getElementById('stars-count');
        const phaseBadgeEl = document.getElementById('phase-badge');
        const charBadgeEl = document.getElementById('char-name-badge');
        const selectScreen = document.getElementById('char-select-screen');
        const winOverlay = document.getElementById('win-overlay');
        const winTitleEl = document.getElementById('win-title');
        const winDescEl = document.getElementById('win-desc');
        const winNextBtn = document.getElementById('win-next-btn');

        // --- SISTEMA DE SÍNTESE DE VOZ ---
        function speakText(text, rate = 0.9, pitch = 1.2) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                utterance.rate = rate;
                utterance.pitch = pitch;

                const voices = window.speechSynthesis.getVoices();
                const ptVoice = voices.find(v => v.lang.includes('pt-BR') || v.lang.includes('pt'));
                if (ptVoice) utterance.voice = ptVoice;

                window.speechSynthesis.speak(utterance);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // --- SISTEMA DE EFEITOS SONOROS ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(550, now + 0.14);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                osc.start(now);
                osc.stop(now + 0.14);
            } else if (type === 'fruit') {
                // Som de mordida/delícia
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // Ré
                osc.frequency.setValueAtTime(880, now + 0.08);   // Lá
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'block') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(260, now);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.1);
                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'stomp') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(70, now + 0.18);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                osc.start(now);
                osc.stop(now + 0.18);
            } else if (type === 'win') {
                [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.value = freq;
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    g.gain.setValueAtTime(0.22, now + idx * 0.09);
                    g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.09 + 0.35);
                    o.start(now + idx * 0.09);
                    o.stop(now + idx * 0.09 + 0.35);
                });
            }
        }

        // --- RENDERIZADOR REALISTA DOS PERSONAGENS DA FAMÍLIA ---
        function drawRealisticCharacter(c, type, x, y, width, height, facingLeft = false, frame = 0) {
            c.save();
            c.translate(x + width/2, y + height);
            if (facingLeft) c.scale(-1, 1);

            const walkBounce = frame % 2 === 1 ? -2.5 : 0;
            const legSwing = frame % 2 === 1 ? 7 : -7;

            if (type === 'henrique') {
                // ==========================================
                // 🕷️ HENRIQUE: Criança, Traje Homem-Aranha realista, Cabelo Curto, Pele Parda
                // ==========================================
                // Pernas do Aranha
                c.fillStyle = '#dc2626'; // Vermelho clássico
                c.fillRect(-13 + legSwing, -20 + walkBounce, 11, 20);
                c.fillRect(2 - legSwing, -20 + walkBounce, 11, 20);
                // Botas vermelhas e pernas azuis
                c.fillStyle = '#1d4ed8'; // Azul Royal
                c.fillRect(-13 + legSwing, -20 + walkBounce, 11, 11);
                c.fillRect(2 - legSwing, -20 + walkBounce, 11, 11);

                // Tronco / Peitoral Homem-Aranha com texturas
                c.fillStyle = '#1d4ed8'; // Laterais azuis
                c.fillRect(-16, -42 + walkBounce, 32, 22);
                c.fillStyle = '#dc2626'; // Faixa central vermelha
                c.fillRect(-10, -42 + walkBounce, 20, 22);

                // Desenho das teias no peito
                c.strokeStyle = 'rgba(0,0,0,0.35)';
                c.lineWidth = 1;
                c.beginPath();
                c.moveTo(-10, -32 + walkBounce); c.lineTo(10, -32 + walkBounce);
                c.moveTo(0, -42 + walkBounce); c.lineTo(0, -20 + walkBounce);
                c.stroke();

                // Emblema da Aranha Negra no Peito
                c.fillStyle = '#0f172a';
                c.beginPath();
                c.ellipse(0, -32 + walkBounce, 4, 6, 0, 0, Math.PI*2);
                c.fill();
                // Perninhas da aranha
                c.strokeStyle = '#0f172a';
                c.lineWidth = 1.2;
                c.beginPath();
                c.moveTo(-3, -34 + walkBounce); c.lineTo(-8, -37 + walkBounce);
                c.moveTo(-3, -31 + walkBounce); c.lineTo(-9, -31 + walkBounce);
                c.moveTo(3, -34 + walkBounce); c.lineTo(8, -37 + walkBounce);
                c.moveTo(3, -31 + walkBounce); c.lineTo(9, -31 + walkBounce);
                c.stroke();

                // Braços com luvas vermelhas
                c.fillStyle = '#1d4ed8';
                c.fillRect(10, -40 + walkBounce, 7, 12);
                c.fillStyle = '#dc2626';
                c.fillRect(10, -28 + walkBounce, 7, 10);

                // --- CABEÇA REAL DO HENRIQUE ---
                if (henriqueImgLoaded) {
                    // Desenha a foto real do Henrique com recorte transparente
                    const headW = 38;
                    const headH = 42;
                    c.drawImage(henriqueImg, -headW/2, -42 - headH + walkBounce, headW, headH);
                    
                    // Pequena máscara de Homem-Aranha estilosa erguida na testa do Henrique
                    c.fillStyle = '#dc2626';
                    c.beginPath();
                    c.ellipse(0, -42 - headH + 4 + walkBounce, 11, 4.5, 0, 0, Math.PI*2);
                    c.fill();
                    c.strokeStyle = '#0f172a';
                    c.lineWidth = 1;
                    c.stroke();
                } else {
                    // Cabeça fallback vetorizada
                    c.fillStyle = '#d49b72';
                    c.beginPath();
                    c.arc(0, -54 + walkBounce, 15, 0, Math.PI*2);
                    c.fill();

                    c.fillStyle = '#2d1810';
                    c.beginPath();
                    c.arc(0, -58 + walkBounce, 16.5, Math.PI*0.85, Math.PI*2.15);
                    c.fill();

                    c.fillStyle = '#1e293b';
                    c.beginPath();
                    c.arc(5.5, -53 + walkBounce, 2.2, 0, Math.PI*2);
                    c.fill();
                }
            }
            else if (type === 'anderson') {
                // ==========================================
                // 🧔 PAI ANDERSON: Gordinho, Barba realista, Cabelo curto grisalho leve, Pele parda
                // ==========================================
                // Pernas / Calça Jeans
                c.fillStyle = '#1e3a8a'; // Jeans escuro com sombreamento
                c.fillRect(-17 + legSwing, -24 + walkBounce, 15, 24);
                c.fillRect(2 - legSwing, -24 + walkBounce, 15, 24);
                // Tênis esportivo moderno
                c.fillStyle = '#f8fafc';
                c.fillRect(-17 + legSwing, -7 + walkBounce, 17, 7);
                c.fillRect(2 - legSwing, -7 + walkBounce, 17, 7);
                c.fillStyle = '#0284c7';
                c.fillRect(-17 + legSwing, -5 + walkBounce, 17, 2.5);
                c.fillRect(2 - legSwing, -5 + walkBounce, 17, 2.5);

                // Tronco: Camiseta Polo Azul, formato gordinho forte
                c.fillStyle = '#0284c7';
                c.beginPath();
                c.ellipse(0, -42 + walkBounce, 23, 20, 0, 0, Math.PI*2);
                c.fill();
                // Gola da camiseta polo
                c.fillStyle = '#0369a1';
                c.beginPath();
                c.moveTo(-8, -58 + walkBounce); c.lineTo(0, -48 + walkBounce); c.lineTo(8, -58 + walkBounce);
                c.fill();

                // Cabeça: Pele parda realista
                c.fillStyle = '#c58b63';
                c.beginPath();
                c.arc(0, -68 + walkBounce, 17, 0, Math.PI*2);
                c.fill();

                // Cabelo curto elegante com grisalho sutil
                c.fillStyle = '#334155'; // Base escura
                c.beginPath();
                c.arc(0, -73 + walkBounce, 18, Math.PI*0.85, Math.PI*2.15);
                c.fill();
                // Mechas grisalhas suaves
                c.strokeStyle = '#94a3b8';
                c.lineWidth = 1.8;
                c.beginPath();
                c.arc(-4, -73 + walkBounce, 14, Math.PI*0.9, Math.PI*1.4);
                c.arc(4, -73 + walkBounce, 14, Math.PI*1.6, Math.PI*2.1);
                c.stroke();

                // Barba modelada do Anderson
                c.fillStyle = '#1e293b';
                c.beginPath();
                c.arc(3, -62 + walkBounce, 15, 0.15, Math.PI*0.85);
                c.fill();
                // Fios grisalhos na barba
                c.strokeStyle = '#64748b';
                c.lineWidth = 1;
                c.beginPath();
                c.moveTo(0, -56 + walkBounce); c.lineTo(0, -50 + walkBounce);
                c.moveTo(5, -57 + walkBounce); c.lineTo(5, -51 + walkBounce);
                c.stroke();

                // Olhos expressivos e olhar protetor
                c.fillStyle = '#0f172a';
                c.beginPath();
                c.arc(6, -69 + walkBounce, 2.8, 0, Math.PI*2);
                c.fill();
                c.fillStyle = '#ffffff';
                c.beginPath();
                c.arc(7, -70 + walkBounce, 1, 0, Math.PI*2);
                c.fill();
            }
            else if (type === 'mamae') {
                // ==========================================
                // 👩 MÃE: Cabelo castanho ondulado, óculos, blusa rosa, jeans, pele parda
                // ==========================================
                // Calça Jeans bonita
                c.fillStyle = '#2563eb';
                c.fillRect(-15 + legSwing, -23 + walkBounce, 13, 23);
                c.fillRect(2 - legSwing, -23 + walkBounce, 13, 23);
                c.fillStyle = '#fce7f3';
                c.fillRect(-15 + legSwing, -6 + walkBounce, 14, 6);
                c.fillRect(2 - legSwing, -6 + walkBounce, 14, 6);

                // Cabelo castanho ondulado (Camada de trás volumosa)
                c.fillStyle = '#452210';
                c.beginPath();
                c.ellipse(-3, -56 + walkBounce, 24, 23, 0, 0, Math.PI*2);
                c.fill();
                // Mechas onduladas caindo
                c.beginPath();
                c.arc(-16, -42 + walkBounce, 8, 0, Math.PI*2);
                c.arc(12, -42 + walkBounce, 8, 0, Math.PI*2);
                c.fill();

                // Blusa Rosa drapeada com brilho
                c.fillStyle = '#ec4899'; // Rosa vibrante
                c.beginPath();
                c.ellipse(0, -39 + walkBounce, 21, 18, 0, 0, Math.PI*2);
                c.fill();
                c.fillStyle = '#f472b6';
                c.beginPath();
                c.ellipse(0, -41 + walkBounce, 15, 12, 0, 0, Math.PI*2);
                c.fill();

                // Cabeça: Pele parda suave
                c.fillStyle = '#d49b72';
                c.beginPath();
                c.arc(0, -64 + walkBounce, 16, 0, Math.PI*2);
                c.fill();

                // Cabelo ondulado na frente com mechas
                c.fillStyle = '#452210';
                c.beginPath();
                c.arc(-1, -71 + walkBounce, 18, Math.PI*0.8, Math.PI*2.15);
                c.fill();

                // Óculos estilosos com reflexo de lente
                c.strokeStyle = '#be185d';
                c.lineWidth = 2.5;
                c.fillStyle = 'rgba(255,255,255,0.35)';
                // Lente Direita
                c.fillRect(1, -67 + walkBounce, 11, 9);
                c.strokeRect(1, -67 + walkBounce, 11, 9);
                // Lente Esquerda
                c.fillRect(-13, -67 + walkBounce, 11, 9);
                c.strokeRect(-13, -67 + walkBounce, 11, 9);
                // Ponte
                c.beginPath();
                c.moveTo(-2, -63 + walkBounce); c.lineTo(1, -63 + walkBounce);
                c.stroke();

                // Olhos e sorriso carinhoso
                c.fillStyle = '#1e293b';
                c.beginPath();
                c.arc(6, -63 + walkBounce, 2.2, 0, Math.PI*2);
                c.fill();
                c.strokeStyle = '#9f1239';
                c.lineWidth = 2;
                c.beginPath();
                c.arc(4, -56 + walkBounce, 5, 0.2, Math.PI*0.8);
                c.stroke();
            }
            else if (type === 'vovo') {
                // ==========================================
                // 👵 VOVÓ: Cabelo curto branco/grisalho, óculos dourados, postura curvadinha, xale
                // ==========================================
                // Vestido e sapatinhos
                c.fillStyle = '#6b21a8'; // Roxo nobre
                c.beginPath();
                c.moveTo(-16, -18 + walkBounce); c.lineTo(16, -18 + walkBounce);
                c.lineTo(12, -40 + walkBounce); c.lineTo(-12, -40 + walkBounce);
                c.closePath();
                c.fill();
                c.fillStyle = '#1e293b';
                c.fillRect(-13 + legSwing, -6 + walkBounce, 12, 6);
                c.fillRect(2 - legSwing, -6 + walkBounce, 12, 6);

                // Tronco curvadinho com Xale com franjas
                c.fillStyle = '#9333ea';
                c.beginPath();
                c.ellipse(3, -38 + walkBounce, 17, 16, 0.2, 0, Math.PI*2);
                c.fill();
                // Xale aconchegante
                c.fillStyle = '#d8b4fe';
                c.beginPath();
                c.moveTo(-12, -48 + walkBounce);
                c.lineTo(16, -42 + walkBounce);
                c.lineTo(4, -32 + walkBounce);
                c.closePath();
                c.fill();

                // Cabeça: Pele parda média com sorriso terno
                c.fillStyle = '#c58b63';
                c.beginPath();
                c.arc(5, -57 + walkBounce, 14.5, 0, Math.PI*2);
                c.fill();

                // Cabelo curto volumoso e encaracolado grisalho/branco
                c.fillStyle = '#e2e8f0';
                c.beginPath();
                c.arc(5, -63 + walkBounce, 17, Math.PI*0.7, Math.PI*2.2);
                c.fill();
                // Ondinhas de cachos da vovó
                c.beginPath();
                c.arc(-8, -60 + walkBounce, 6, 0, Math.PI*2);
                c.arc(0, -66 + walkBounce, 6, 0, Math.PI*2);
                c.arc(12, -66 + walkBounce, 6, 0, Math.PI*2);
                c.arc(17, -59 + walkBounce, 6, 0, Math.PI*2);
                c.fill();

                // Óculos dourados da vovó
                c.strokeStyle = '#ca8a04';
                c.lineWidth = 2.4;
                c.beginPath();
                c.arc(9, -56 + walkBounce, 5.5, 0, Math.PI*2);
                c.arc(-1, -56 + walkBounce, 5.5, 0, Math.PI*2);
                c.stroke();
                // Olhos gentis
                c.fillStyle = '#1e293b';
                c.beginPath();
                c.arc(9, -56 + walkBounce, 2, 0, Math.PI*2);
                c.fill();
                // Sorriso terno
                c.strokeStyle = '#831843';
                c.lineWidth = 2;
                c.beginPath();
                c.arc(7, -49 + walkBounce, 4, 0.2, Math.PI*0.8);
                c.stroke();
            }

            c.restore();
        }

        // --- MUNDO, FÍSICA E CENÁRIOS ---

        function nextPhaseOrRestart() {
            winOverlay.classList.add('hidden-screen');
            if (currentPhaseIndex < PHASES.length - 1) {
                currentPhaseIndex++;
                initLevel(currentPhaseIndex);
                gameRunning = true;
                speakText(`Bem-vindo à ${PHASES[currentPhaseIndex].name}!`);
            } else {
                currentPhaseIndex = 0;
                initLevel(0);
                gameRunning = true;

        // Teclado (PC)
        window.addEventListener('keydown', e => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') {
                if (!keys.jump && player.grounded) {
                    player.vy = player.jumpPower;
                    player.grounded = false;
                    playSound('jump');
                }
                keys.jump = true;
            }
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.jump = false;
        });

        // Controles Touch (Mobile)
        function bindTouch(btnId, action) {
            const btn = document.getElementById(btnId);
            if (!btn) return;

            const startAction = (e) => {
                e.preventDefault();
                initAudio();
                btn.classList.add('pressed');
                if (action === 'left') keys.left = true;
                if (action === 'right') keys.right = true;
                if (action === 'jump') {
                    if (player.grounded) {
                        player.vy = player.jumpPower;
                        player.grounded = false;
                        playSound('jump');
                    }
                    keys.jump = true;
                }
            };

            const endAction = (e) => {
                e.preventDefault();
                btn.classList.remove('pressed');
                if (action === 'left') keys.left = false;
                if (action === 'right') keys.right = false;
                if (action === 'jump') keys.jump = false;
            };

            btn.addEventListener('pointerdown', startAction);
            btn.addEventListener('pointerup', endAction);
            btn.addEventListener('pointercancel', endAction);
        }

        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-jump', 'jump');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let floatingTexts = [];
        function spawnFloatingText(x, y, text) {
            floatingTexts.push({ x: x, y: y, text: text, vy: -1.6, life: 1.0 });
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: color,
                    life: 1.0
                });
            }
        }

        function checkCollision(r1, r2) {
            return r1.x < r2.x + r2.w &&
                   r1.x + r1.width > r2.x &&
                   r1.y < r2.y + r2.h &&
                   r1.y + r1.height > r2.y;
        }

        // --- ATUALIZAÇÃO DA FÍSICA ---
        function update() {
            if (!gameRunning) return;

            // Movimento Horizontal
            if (keys.left) {
                player.vx = -player.speed;
                player.facingLeft = true;
            } else if (keys.right) {
                player.vx = player.speed;
                player.facingLeft = false;
            } else {
                player.vx *= 0.78;
            }

            if (Math.abs(player.vx) > 0.5 && player.grounded) {
                player.animTimer++;
                if (player.animTimer > 8) {
                    player.animFrame++;
                    player.animTimer = 0;
                }
            } else {
                player.animFrame = 0;
            }

            player.vy += GRAVITY;

            // Colisão X
            player.x += player.vx;
            blocks.forEach(b => {
                if (checkCollision(player, b)) {
                    if (player.vx > 0) player.x = b.x - player.width;
                    else if (player.vx < 0) player.x = b.x + b.w;
                }
            });

            // Colisão Y
            player.y += player.vy;
            player.grounded = false;

            blocks.forEach(b => {
                if (checkCollision(player, b)) {
                    if (player.vy > 0 && player.y + player.height - player.vy <= b.y + 12) {
                        player.y = b.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    }
                    // Bateu a cabeça por baixo do bloco [?]
                    else if (player.vy < 0) {
                        player.y = b.y + b.h;
                        player.vy = 2;
                        
                        if (b.type === 'question' && !b.hit) {
                            b.hit = true;
                            b.bounce = 12;
                            playSound('block');

                            if (b.food) {
                                fruitsCollected++;
                                fruitsCountEl.textContent = fruitsCollected;
                                playSound('fruit');
                                spawnFloatingText(b.x + 20, b.y, `${b.food.emoji} ${b.food.name}!`);
                                speakText(b.food.phrase);
                                spawnParticles(b.x + 26, b.y, '#22c55e');
                            }
                        }
                    }
                }
            });

            blocks.forEach(b => {
                if (b.bounce > 0) b.bounce -= 1;
            });

            // Resgate seguro de nuvem
            if (player.y > 600) {
                player.y = 350;
                player.vy = 0;
                player.x = Math.max(80, player.x - 200);
                speakText("A nuvem protetora te resgatou! Continue!");
            }

            // Coleta de Moedas/Estrelas
            collectibles.forEach(c => {
                if (!c.collected && Math.hypot((player.x + player.width/2) - (c.x + c.size/2), (player.y + player.height/2) - (c.y + c.size/2)) < 36) {
                    c.collected = true;
                    starsCollected++;
                    starsCountEl.textContent = starsCollected;
                    playSound('fruit');
                    spawnParticles(c.x, c.y, '#facc15');
                    spawnFloatingText(c.x, c.y, '⭐ +1');
                }
            });

            // Inimigos fofos de gelatina
            enemies.forEach(e => {
                if (!e.alive) return;
                e.x += e.vx;
                if (e.x < 300 || e.x > 3100) e.vx *= -1;

                if (checkCollision(player, { x: e.x, y: e.y, w: e.w, h: e.h })) {
                    if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 14) {
                        e.alive = false;
                        player.vy = player.jumpPower * 0.75;
                        playSound('stomp');
                        spawnParticles(e.x + 20, e.y + 20, e.color);
                        spawnFloatingText(e.x + 20, e.y, '❤️ Pluft!');
                    } else {
                        player.vx = player.x < e.x ? -7 : 7;
                        player.vy = -4;
                        playSound('block');
                    }
                }
            });

            // Castelo Final da Fase
            if (player.x >= finishPole.x) {
                gameRunning = false;
                playSound('win');
                const isLast = currentPhaseIndex >= PHASES.length - 1;
                winTitleEl.textContent = isLast ? "CAMPEÕES DA SAÚDE! 🏆" : "FASE CONCLUÍDA! 🌟";
                winDescEl.textContent = isLast 
                    ? `A família completou todas as aventuras com muitas frutas e energia!`
                    : `Você coletou ${fruitsCollected} frutas saudáveis! Vamos para a próxima fase?`;
                winNextBtn.textContent = isLast ? "Jogar Novamente 🔄" : "Próxima Fase ▶";
                speakText(`Muito bem! Você completou a ${PHASES[currentPhaseIndex].name}!`);
                winOverlay.classList.remove('hidden-screen');
            }

            // Câmera
            const targetCamX = player.x - window.innerWidth * 0.35;
            cameraX += (targetCamX - cameraX) * 0.1;
            cameraX = Math.max(0, cameraX);

            particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.02; });
            particles = particles.filter(p => p.life > 0);
        }

        // --- RENDERIZAÇÃO DOS CENÁRIOS E PERSONAGENS ---
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const currentPhase = PHASES[currentPhaseIndex];

            // 1. Céu Dinâmico por Fase
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, currentPhase.skyTop);
            skyGrad.addColorStop(1, currentPhase.skyBottom);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Efeito especial da Fase 3 (Estrelas na noite) ou Sol na Fase 2
            if (currentPhase.theme === 'night') {
                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 40; i++) {
                    const sx = (i * 97) % canvas.width;
                    const sy = (i * 53) % (canvas.height * 0.6);
                    ctx.fillRect(sx, sy, 2, 2);
                }
                // Lua brilhante
                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(canvas.width - 120, 80, 35, 0, Math.PI*2);
                ctx.fill();
            } else if (currentPhase.theme === 'beach') {
                // Sol poente alaranjado
                ctx.fillStyle = '#fdba74';
                ctx.beginPath();
                ctx.arc(canvas.width * 0.5, canvas.height * 0.55, 90, 0, Math.PI*2);
                ctx.fill();
            }

            ctx.save();
            ctx.translate(-cameraX, 0);

            // 2. Elementos de Fundo (Nuvens, Coqueiros, Vagalumes)
            sceneryProps.forEach(sp => {
                if (sp.type === 'park') {
                    // Nuvens fofas
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.beginPath();
                    ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI*2);
                    ctx.arc(sp.x + sp.size*0.7, sp.y - sp.size*0.2, sp.size*0.8, 0, Math.PI*2);
                    ctx.arc(sp.x + sp.size*1.3, sp.y, sp.size*0.9, 0, Math.PI*2);
                    ctx.fill();
                } else if (sp.type === 'beach') {
                    // Gaivotas voando
                    ctx.strokeStyle = '#475569';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(sp.x, sp.y, 10, Math.PI, 0);
                    ctx.arc(sp.x + 20, sp.y, 10, Math.PI, 0);
                    ctx.stroke();
                } else if (sp.type === 'night') {
                    // Vagalumes brilhantes
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath();
                    ctx.arc(sp.x, sp.y + Math.sin(Date.now()*0.003 + sp.x)*10, 3.5, 0, Math.PI*2);
                    ctx.fill();
                }
            });

            // 3. Colinas / Ondas ao fundo
            for (let i = 0; i < 10; i++) {
                const hillX = i * 450 + 100;
                ctx.fillStyle = currentPhase.hillColor;
                ctx.beginPath();
                ctx.ellipse(hillX, 480, 170, 130, 0, Math.PI, Math.PI*2);
                ctx.fill();
                // Olhinhos alegres na colina (estilo Mario World)
                if (currentPhase.theme !== 'night') {
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(hillX - 25, 410, 6, 16);
                    ctx.fillRect(hillX + 20, 410, 6, 16);
                }
            }

            // 4. Blocos e Chão
            blocks.forEach(b => {
                const bounceY = b.y - (b.bounce || 0);

                if (b.type === 'ground') {
                    ctx.fillStyle = currentPhase.groundTop;
                    ctx.fillRect(b.x, b.y, b.w, 24);
                    ctx.fillStyle = currentPhase.groundBottom;
                    ctx.fillRect(b.x, b.y + 24, b.w, b.h - 24);
                }
                else if (b.type === 'question') {
                    if (b.hit) {
                        ctx.fillStyle = '#94a3b8';
                        ctx.fillRect(b.x, bounceY, b.w, b.h);
                        ctx.strokeStyle = '#475569';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(b.x, bounceY, b.w, b.h);
                    } else {
                        // Bloco dourado brilhante
                        ctx.fillStyle = '#f59e0b';
                        ctx.fillRect(b.x, bounceY, b.w, b.h);
                        ctx.fillStyle = '#fbbf24';
                        ctx.fillRect(b.x + 4, bounceY + 4, b.w - 8, b.h - 8);
                        ctx.strokeStyle = '#b45309';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(b.x, bounceY, b.w, b.h);

                        ctx.fillStyle = '#78350f';
                        ctx.font = 'bold 30px "Fredoka", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('?', b.x + b.w/2, bounceY + 37);
                    }
                }
                else if (b.type === 'brick') {
                    ctx.fillStyle = currentPhase.theme === 'night' ? '#6366f1' : '#b45309';
                    ctx.fillRect(b.x, bounceY, b.w, b.h);
                    ctx.fillStyle = currentPhase.theme === 'night' ? '#818cf8' : '#d97706';
                    ctx.fillRect(b.x + 3, bounceY + 3, b.w - 6, b.h - 6);
                    ctx.strokeStyle = '#312e81';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(b.x, bounceY, b.w, b.h);
                }
            });

            // 5. Frutas Flutuantes Colecionáveis
            collectibles.forEach(c => {
                if (c.collected) return;
                const floatY = c.y + Math.sin(Date.now()*0.005 + c.offset) * 6;
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(c.x + c.size/2, floatY, c.size/2, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = '#ca8a04';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.fillStyle = '#78350f';
                ctx.font = '16px "Fredoka"';
                ctx.textAlign = 'center';
                ctx.fillText('⭐', c.x + c.size/2, floatY + 5);
            });

            // 6. Inimigos Gelatina
            enemies.forEach(e => {
                if (!e.alive) return;
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/2, Math.PI, 0);
                ctx.lineTo(e.x + e.w, e.y + e.h);
                ctx.lineTo(e.x, e.y + e.h);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(e.x + 13, e.y + 19, 5, 0, Math.PI*2);
                ctx.arc(e.x + 29, e.y + 19, 5, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(e.x + 14, e.y + 19, 2.5, 0, Math.PI*2);
                ctx.arc(e.x + 30, e.y + 19, 2.5, 0, Math.PI*2);
                ctx.fill();
            });

            // 7. Castelo Temático no Final
            const castX = finishPole.x;
            ctx.fillStyle = currentPhase.castleColor;
            ctx.fillRect(castX + 120, 260, 220, 220);
            ctx.fillStyle = '#64748b';
            ctx.fillRect(castX + 90, 200, 70, 280);
            ctx.fillRect(castX + 300, 200, 70, 280);
            // Telhados
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(castX + 75, 200); ctx.lineTo(castX + 125, 120); ctx.lineTo(castX + 175, 200);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(castX + 285, 200); ctx.lineTo(castX + 335, 120); ctx.lineTo(castX + 385, 200);
            ctx.fill();

            // Mastro da Bandeira
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(castX, 160); ctx.lineTo(castX, 480);
            ctx.stroke();
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(castX, 160, 60, 40);
            ctx.fillStyle = '#ffffff';
            ctx.font = '22px "Fredoka"';
            ctx.fillText('🍎', castX + 16, 188);

            // 8. Desenho Realista do Personagem Selecionado
            drawRealisticCharacter(
                ctx, 
                selectedHero, 
                player.x, 
                player.y, 
                player.width, 
                player.height, 
                player.facingLeft, 
                player.animFrame
            );

            // 9. Partículas
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            // 10. Textos Flutuantes de Frutas Saudáveis
            floatingTexts.forEach(ft => {
                ft.y += ft.vy;
                ft.life -= 0.02;
                ctx.fillStyle = `rgba(255, 255, 255, ${ft.life})`;
                ctx.strokeStyle = `rgba(0, 0, 0, ${ft.life})`;
                ctx.lineWidth = 3.5;
                ctx.font = 'bold 24px "Fredoka", sans-serif';
                ctx.textAlign = 'center';
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillText(ft.text, ft.x, ft.y);
            });
            floatingTexts = floatingTexts.filter(ft => ft.life > 0);

            ctx.restore();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        window.onload = () => {
            renderPreviews();
            initLevel(0);
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
