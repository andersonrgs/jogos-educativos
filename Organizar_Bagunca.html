<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Organizando o Quarto</title>
<style>
  * { 
    box-sizing: border-box; 
    user-select: none; 
    -webkit-tap-highlight-color: transparent; 
    touch-action: manipulation; 
  }
  
  body { 
    margin: 0; 
    height: 100dvh; 
    font-family: 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif; 
    background: radial-gradient(circle at 50% 0%, #fff7e6 0%, #ffe0b2 100%); 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    overflow: hidden; 
    color: #5d4037;
  }

  h1 { 
    font-size: clamp(22px, 5vh, 40px); 
    margin: 2vh 0 1vh 0; 
    text-align: center; 
    font-weight: 800;
    text-shadow: 2px 2px 0px #fff;
    flex: none;
    animation: bounceIn 0.8s ease-out;
  }
  
  @keyframes bounceIn {
    0% { transform: translateY(-50px); opacity: 0; }
    60% { transform: translateY(10px); opacity: 1; }
    100% { transform: translateY(0); }
  }

  #game-container {
    flex: 1;
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    padding: 1vh 4vw 3vh 4vw;
    gap: 3vh;
    min-height: 0;
  }

  /* Área das silhuetas: Agora parece um tapete ou piso onde as coisas caíram */
  #targets-area {
    flex: 1;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 30px;
    border: 4px dashed #ffb74d;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.05);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 15px;
    padding: 20px;
    place-items: center;
    align-content: center;
    overflow-y: auto;
  }

  /* Silhuetas espalhadas (usando variável css --rot para rotação aleatória) */
  .target {
    font-size: clamp(65px, 12vh, 130px);
    line-height: 1;
    filter: brightness(0) opacity(0.12);
    cursor: pointer;
    position: relative;
    /* Começa invisível para animação de entrada */
    transform: scale(0) rotate(var(--rot));
    animation: playfulPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) var(--delay) forwards;
  }

  @keyframes playfulPop {
    0% { transform: scale(0) rotate(calc(var(--rot) - 30deg)); opacity: 0; }
    80% { transform: scale(1.15) rotate(calc(var(--rot) + 5deg)); opacity: 1; }
    100% { transform: scale(1) rotate(var(--rot)); opacity: 1; }
  }

  .target.filled {
    filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.2)); 
    pointer-events: none;
    animation: jellyPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes jellyPop {
    0% { transform: scale(0.5) rotate(calc(var(--rot) - 15deg)); }
    40% { transform: scale(1.3) rotate(calc(var(--rot) + 10deg)); }
    70% { transform: scale(0.9) rotate(calc(var(--rot) - 5deg)); }
    100% { transform: scale(1) rotate(var(--rot)); }
  }

  .shake {
    animation: errorShake 0.4s ease-in-out;
    filter: brightness(0) opacity(0.12) drop-shadow(0 0 15px red);
  }
  @keyframes errorShake {
    0%, 100% { transform: translateX(0) scale(1) rotate(var(--rot)); }
    20% { transform: translateX(-15px) scale(0.95) rotate(calc(var(--rot) - 10deg)); }
    40% { transform: translateX(15px) scale(0.95) rotate(calc(var(--rot) + 10deg)); }
    60% { transform: translateX(-15px) scale(0.95) rotate(calc(var(--rot) - 10deg)); }
    80% { transform: translateX(15px) scale(0.95) rotate(calc(var(--rot) + 10deg)); }
  }

  #items-area {
    flex: none;
    min-height: clamp(100px, 18vh, 160px);
    background: #fff;
    border-radius: 30px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 15px;
    padding: 15px;
  }

  .item {
    font-size: clamp(50px, 9vh, 90px);
    line-height: 1;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    padding: 5px;
    border-radius: 20px;
    border: 4px solid transparent;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,0.15));
    transform: scale(0) rotate(var(--rot));
    animation: playfulPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) var(--delay) forwards;
  }

  .item:active {
    transform: scale(0.9) rotate(var(--rot));
  }

  .item.selected {
    background: #e3f2fd;
    border-color: #29b6f6;
    animation: pulse 1.5s infinite;
    z-index: 10;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1.15) translateY(-8px) rotate(var(--rot)); filter: drop-shadow(0 15px 10px rgba(41, 182, 246, 0.4)); }
    50% { transform: scale(1.25) translateY(-15px) rotate(calc(var(--rot) + 5deg)); filter: drop-shadow(0 20px 15px rgba(41, 182, 246, 0.6)); }
  }

  .item.hidden {
    transform: scale(0) rotate(var(--rot));
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s ease-out;
  }

  .star-particle {
    position: fixed;
    font-size: clamp(20px, 4vh, 40px);
    pointer-events: none;
    z-index: 100;
    transform: translate(-50%, -50%) scale(0);
    animation: explode 0.7s ease-out forwards;
  }

  @keyframes explode {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    50% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.2) rotate(var(--rot)); opacity: 0; }
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(5px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    padding: 20px;
    text-align: center;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  
  .overlay h1 { font-size: clamp(35px, 8vh, 60px); color: #ff9800; margin-bottom: 10px; }
  .overlay p { font-size: clamp(18px, 3vh, 26px); color: #666; margin-bottom: 40px; }
  .overlay h2 { font-size: clamp(30px, 6vh, 50px); color: #4caf50; margin: 0 0 30px 0; }
  
  button {
    font-size: clamp(24px, 4.5vh, 36px);
    font-weight: 900;
    padding: 20px 50px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(180deg, #66bb6a, #388e3c);
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 0 #1b5e20, 0 15px 20px rgba(0,0,0,0.2);
    transition: all 0.1s;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  button:active {
    transform: translateY(8px);
    box-shadow: 0 0px 0 #1b5e20;
  }

</style>
</head>
<body>

<h1 id="title">Carregando...</h1>

<div id="game-container">
  <div id="targets-area"></div>
  <div id="items-area"></div>
</div>

<div id="start-overlay" class="overlay show">
  <h1>Organizando o Quarto</h1>
  <p>Toque no objeto e encaixe na sombra!</p>
  <button id="start-btn">JOGAR!</button>
</div>

<div id="msg-overlay" class="overlay">
  <h2 id="overlay-msg">Muito bem!</h2>
  <button id="next-btn">Próxima Fase</button>
</div>

<script>
/* ---------- Áudio ---------- */
let ac, master;
function initAudio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = 0.5;
      master.connect(ac.destination);
    } catch(e) {}
  }
  if (ac && ac.state === 'suspended') ac.resume();
}

function tone(f0, f1, dur, vol, type='sine', delay=0) {
  if(!ac) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur);
}

const sfx = {
  select: () => { tone(400, 500, 0.1, 0.4, 'sine'); tone(800, 900, 0.1, 0.1, 'triangle', 0.05); },
  error: () => { tone(300, 100, 0.4, 0.6, 'sawtooth'); },
  match: () => { 
    tone(523.25, 523.25, 0.15, 0.3, 'sine', 0);   
    tone(659.25, 659.25, 0.15, 0.3, 'sine', 0.1); 
    tone(783.99, 783.99, 0.3, 0.3, 'sine', 0.2);  
  },
  winPhase: () => {
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => tone(f, f, 0.4, 0.3, 'triangle', i * 0.15));
  }
};

/* ---------- Partículas ---------- */
function spawnParticles(targetEl) {
  const rect = targetEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  
  for (let i = 0; i < 8; i++) {
    const star = document.createElement('div');
    star.textContent = ['✨','⭐','🌟','🎈'][Math.floor(Math.random()*4)];
    star.className = 'star-particle';
    document.body.appendChild(star);
    
    star.style.left = cx + 'px';
    star.style.top = cy + 'px';
    
    const angle = (Math.PI * 2 / 8) * i + (Math.random() * 0.5);
    const dist = 60 + Math.random() * 80;
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist;
    const rot = (Math.random() * 360) + 'deg';
    
    star.style.setProperty('--tx', `${tx}px`);
    star.style.setProperty('--ty', `${ty}px`);
    star.style.setProperty('--rot', rot);
    
    setTimeout(() => star.remove(), 700);
  }
}

/* ---------- Lógica de Fases Aleatórias e Lúdicas ---------- */
// Acervo grande de itens para garantir que o jogo mude a cada execução
const wardrobePool = ['👕', '👖', '🧦', '👟', '👗', '🧢', '🧣', '🧤', '🧥', '🩳'];
const toysPool     = ['⚽', '🚗', '🧸', '🪁', '🚂', '🧩', '🪀', '🤖', '🥁', '🚁'];

function getRandomItems(pool, count) {
  return [...pool].sort(() => Math.random() - 0.5).slice(0, count);
}

function generatePhase(level) {
  if (level === 0) {
    return { title: "👕 Guarda-roupa", items: getRandomItems(wardrobePool, 4) };
  } else if (level === 1) {
    return { title: "🧸 Caixa de Brinquedos", items: getRandomItems(toysPool, 4) };
  } else {
    // Fase 3 (ou mais): Mistura tudo e coloca mais itens
    const mixed = [...wardrobePool, ...toysPool];
    return { title: "🌪️ Quarto Bagunçado", items: getRandomItems(mixed, 6) };
  }
}

let currentPhaseIndex = 0;
let currentPhaseData = null;
let selectedEmoji = null;
let selectedEl = null;
let matchedCount = 0;
let isAnimating = false; // previne cliques muito rápidos durante animações

const titleEl = document.getElementById('title');
const targetsArea = document.getElementById('targets-area');
const itemsArea = document.getElementById('items-area');
const msgOverlay = document.getElementById('msg-overlay');
const startOverlay = document.getElementById('start-overlay');
const overlayMsg = document.getElementById('overlay-msg');
const nextBtn = document.getElementById('next-btn');

function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

function loadPhase(index) {
  currentPhaseData = generatePhase(index); // Gera de forma única toda vez
  
  // Animação de título lúdica
  titleEl.style.animation = 'none';
  void titleEl.offsetWidth;
  titleEl.style.animation = 'bounceIn 0.8s ease-out';
  titleEl.textContent = `Fase ${index + 1}: ${currentPhaseData.title}`;
  
  targetsArea.innerHTML = '';
  itemsArea.innerHTML = '';
  selectedEmoji = null;
  selectedEl = null;
  matchedCount = 0;
  isAnimating = false;
  msgOverlay.classList.remove('show');

  // Adiciona itens no alvo espalhados de forma lúdica
  const targetItems = [...currentPhaseData.items];
  shuffle(targetItems).forEach((emoji, i) => {
    const el = document.createElement('div');
    el.className = 'target';
    el.textContent = emoji;
    el.dataset.emoji = emoji;
    // Rotação aleatória (-25 a 25 graus) para parecer espalhado
    const randomRot = (Math.random() * 50 - 25).toFixed(1) + 'deg';
    // Delay escalonado para as peças entrarem "pipocando" uma por vez
    const randomDelay = (i * 0.1).toFixed(2) + 's';
    
    el.style.setProperty('--rot', randomRot);
    el.style.setProperty('--delay', randomDelay);
    
    el.onclick = () => onTargetClick(el);
    targetsArea.appendChild(el);
  });

  // Adiciona itens na barra inferior também giradinhos e lúdicos
  const sourceItems = [...currentPhaseData.items];
  shuffle(sourceItems).forEach((emoji, i) => {
    const el = document.createElement('div');
    el.className = 'item';
    el.textContent = emoji;
    el.dataset.emoji = emoji;
    
    const randomRot = (Math.random() * 30 - 15).toFixed(1) + 'deg';
    const randomDelay = (i * 0.1).toFixed(2) + 's';
    
    el.style.setProperty('--rot', randomRot);
    el.style.setProperty('--delay', randomDelay);
    
    el.onclick = () => onItemClick(el, emoji);
    itemsArea.appendChild(el);
  });
}

function onItemClick(el, emoji) {
  if (el.classList.contains('hidden') || isAnimating) return;
  
  if (selectedEl) selectedEl.classList.remove('selected');
  
  if (selectedEl === el) {
    selectedEl = null;
    selectedEmoji = null;
  } else {
    selectedEl = el;
    selectedEmoji = emoji;
    el.classList.add('selected');
    sfx.select();
  }
}

function onTargetClick(targetEl) {
  if (targetEl.classList.contains('filled') || isAnimating) return;
  
  if (!selectedEmoji) {
    triggerError(targetEl);
    return;
  }

  if (targetEl.dataset.emoji === selectedEmoji) {
    // Acerto!
    isAnimating = true;
    targetEl.classList.add('filled');
    
    // Oculta peça da barra inferior
    selectedEl.classList.add('hidden');
    selectedEl.classList.remove('selected');
    
    sfx.match();
    spawnParticles(targetEl);
    
    selectedEmoji = null;
    selectedEl = null;
    matchedCount++;

    if (matchedCount === currentPhaseData.items.length) {
      setTimeout(endPhase, 1000);
    } else {
      setTimeout(() => isAnimating = false, 400); // libera após animação
    }
  } else {
    // Erro!
    triggerError(targetEl);
  }
}

function triggerError(el) {
  isAnimating = true;
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  sfx.error();
  setTimeout(() => {
    el.classList.remove('shake');
    isAnimating = false;
  }, 400);
}

function endPhase() {
  sfx.winPhase();
  if (currentPhaseIndex < 2) { // 3 fases (0, 1, 2)
    overlayMsg.innerHTML = "Excelente!<br>🌟 Muito bem! 🌟";
    nextBtn.textContent = "Próxima Fase";
    nextBtn.onclick = () => {
      currentPhaseIndex++;
      loadPhase(currentPhaseIndex);
    };
  } else {
    overlayMsg.innerHTML = "🏆 Parabéns!<br>Você arrumou tudo! 🏆";
    nextBtn.textContent = "Jogar Novamente";
    nextBtn.onclick = () => {
      currentPhaseIndex = 0;
      loadPhase(currentPhaseIndex); // Vai gerar novos itens
    };
  }
  msgOverlay.classList.add('show');
}

document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  startOverlay.classList.remove('show');
  loadPhase(0);
});
</script>
</body>
</html>
